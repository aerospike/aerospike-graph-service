    name: Publish Firefly Docker Image - Multi Arch - slim - QE
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: [publish-github-amd-slim,publish-github-arm-slim]
    steps:

      - name: Harden the runner (Audit all outbound calls)
