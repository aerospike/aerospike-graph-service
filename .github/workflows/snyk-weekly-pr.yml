name: Create Snyk Fix Pull Requests (Weekly)

on:
  schedule:
    # 8:00 AM UTC every Monday
    - cron: '0 8 * * 1'

jobs:
  trigger-weekly-build:
    name: Create Snyk Fix Pull Requests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.WEEKLY_SNYK_PR_TOKEN }}
      - name: Set Run Date Stamp
        run: echo "WEEKLY=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
      - name: Create Snyk Pull Requests
        if: always()
        shell: bash
        run: |
          set +e
          out=$(gh pr create -B 3.x-snyk -H 3.x-dev --title "Weekly ${{ env.WEEKLY }}: Snyk vulnerability check 3.x-dev" --body 'Created by Github action' 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if echo "$out" | grep -qi 'No commits between'; then
            echo 'No divergent commits between 3.x-snyk and 3.x-dev; using the weekly-snyk-tracking branch so the Snyk check still runs.'
            branch="weekly-snyk-tracking"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin 3.x-dev
            git checkout -B "$branch" origin/3.x-dev
            git commit --allow-empty -m "Weekly ${{ env.WEEKLY }}: Snyk vulnerability check"
            git push --force origin "$branch"
            out2=$(gh pr create -B 3.x-snyk -H "$branch" --title "Weekly ${{ env.WEEKLY }}: Snyk vulnerability check 3.x-dev" --body 'Created by Github action' 2>&1)
            code2=$?
            echo "$out2"
            if [ "$code2" -ne 0 ] && ! echo "$out2" | grep -qi 'already exists'; then
              exit "$code2"
            fi
            exit 0
          fi
          exit "$code"
        env:
          GH_TOKEN: ${{ secrets.WEEKLY_SNYK_PR_TOKEN }}
