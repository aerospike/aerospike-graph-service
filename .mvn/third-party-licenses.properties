#
# Overrides for dependencies whose POM does not declare a license or
# declares it in a non-canonical form that license-maven-plugin cannot
# match against the allowlist in the `license-check` profile of the
# root pom.xml.
#
# Format (one entry per line):
#     groupId--artifactId--version=License Name
#
# Every entry here is a claim that "the upstream POM is wrong but we
# have verified the actual license elsewhere". Cite the source in the
# comment above the entry.
#

# --- Aliyun / Alibaba Cloud SDKs ------------------------------------
# The aliyun-java-sdk and aliyun-sdk-oss POMs on Maven Central declare
# no <licenses> block. Upstream source trees (github.com/aliyun/*)
# ship an Apache-2.0 LICENSE at the repo root.
#   https://github.com/aliyun/aliyun-openapi-java-sdk/blob/master/LICENSE
#   https://github.com/aliyun/aliyun-oss-java-sdk/blob/master/LICENSE
com.aliyun--aliyun-java-sdk-core--4.5.10=Apache License, Version 2.0
com.aliyun--aliyun-java-sdk-kms--2.11.0=Apache License, Version 2.0
com.aliyun--aliyun-java-sdk-ram--3.1.0=Apache License, Version 2.0
com.aliyun.oss--aliyun-sdk-oss--3.13.0=Apache License, Version 2.0

# --- Jakarta ORO ----------------------------------------------------
# internal dataset Apache project; still shipped transitively by ivy/hadoop.
# Apache-1.1 at source (https://jakarta.apache.org/oro/). Apache-1.1
# is forward-compatible with Apache-2.0 for redistribution purposes.
oro--oro--2.0.8=Apache License, Version 1.1

# --- Apache XBean ASM (shaded) --------------------------------------
# xbean-asm9-shaded is a repackaging of ObjectWeb ASM. Upstream
# declares the license *name* as the URL "http://asm.ow2.org/license.html",
# which is the ASM BSD-3-Clause text.
#   https://asm.ow2.io/license.html
org.apache.xbean--xbean-asm9-shaded--4.23=BSD-3-Clause
