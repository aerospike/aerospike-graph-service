# Rebuilds and re-releases the AGS container alone, from the JARs already published for
# app-version, into its own release bundle.
#
# It fetches those JARs rather than building them. The reactor has no
# project.build.outputTimestamp, so a rebuild from source would ship different bytes under the
# version already released.
name: Respin AGS Container

on:
  workflow_dispatch:
    inputs:
      app-version:
        description: Published AGS version to rebuild the image from, for example 3.3.1
        required: true
        type: string

# publish-ags-artifacts.yml cannot request more than this grants.
permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

jobs:
  publish:
    name: Publish the Container
    uses: ./.github/workflows/publish-ags-artifacts.yml
    with:
      scope: container
      app-version: ${{ inputs.app-version }}
    # Its own calls to sign-artifacts pass the GPG secrets explicitly because those input names
    # are hyphenated; the repository secret names are UPPER_SNAKE, which inherit does match.
    secrets: inherit
