      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Test with Maven
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ vars.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ vars.GCS_CLIENT_EMAIL }}
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          bash scripts/map_aerospike_test_host.sh
          mvn -pl aerospike-graph-gremlin -Dintegration.test.properties=packed test -Dtest='!TestAirRoutes50k,!CacheIntegrationTest' --no-transfer-progress
          bash scripts/stop_aerospike_cluster.sh
          bash -x scripts/start_aerospike.sh
          bash scripts/map_aerospike_test_host.sh
          mvn -pl aerospike-graph-gremlin -Dintegration.test.properties=packed -Dtest=TestAirRoutes50k,CacheIntegrationTest --no-transfer-progress
