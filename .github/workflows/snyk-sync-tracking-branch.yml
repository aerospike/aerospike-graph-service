name: Sync Snyk Tracking Branch

# Keeps weekly-snyk-tracking up to date with 3.x-dev so an open weekly Snyk PR
# picks up new fixes automatically.
on:
  push:
    branches: [3.x-dev]

jobs:
  sync-weekly-snyk-tracking-branch:
    name: Fast-Forward Snyk Tracking Branch to 3.x-dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      # Uses the PAT, not the default GITHUB_TOKEN, so this push triggers the
      # pull_request synchronize event and re-runs snyk-scan.yml.
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
          token: ${{ secrets.WEEKLY_SNYK_PR_TOKEN }}

      - name: Fast-Forward Snyk Tracking Branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WEEKLY_SNYK_PR_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin weekly-snyk-tracking >/dev/null 2>&1; then
            echo "Updating weekly-snyk-tracking to match 3.x-dev so any open Snyk PR based on it retriggers."
            git push --force origin HEAD:weekly-snyk-tracking
          else
            echo "No weekly-snyk-tracking branch present; nothing to sync."
          fi
