          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  build-firefly-docker:
    name: Build Firefly Docker
    timeout-minutes: 120
    needs: start-runner-docker
    runs-on: ${{ needs.start-runner-docker.outputs.label }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          java -XX:+PrintFlagsFinal -version | grep HeapSize
          bash -x scripts/build-docker.sh aerospike/firefly linux/amd64
  test-bulk-loader-call-docker:
    name: Bulk Loader Call with Spark
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build Docker Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
        run: |
          bash -x scripts/build-docker.sh aerospike/firefly-bulk-load linux/amd64
          
          docker run -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/:/opt/aerospike-firefly/conf/ \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-firefly/etc/ \
            aerospike/firefly-bulk-load &
          
          echo "Sleeping for 30 seconds while docker image starts"
          sleep 30
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemote -DfailIfNoTests=false --no-transfer-progress
  negative-test-bulk-loader-call-docker:
    name: Bulk Loader Call without Spark Fails
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build Docker Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
        run: |
          bash -x scripts/build-docker-stripped.sh aerospike/firefly linux/amd64
          
          docker run -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/:/opt/aerospike-firefly/conf/ \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-firefly/etc/ \
            aerospike/firefly &
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemoteFailsWithoutSpark -DfailIfNoTests=false --no-transfer-progress
  run-l3-bulk-loader:
    name: Run L3 Spark Bulk Loader
    timeout-minutes: 150
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Clamp Start Time to Environment
        run: |
          echo "YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "MONTH=$(date +%m)" >> $GITHUB_ENV
          echo "DAY=$(date +%d)" >> $GITHUB_ENV
      - name: Clamp SHA to Environment (Push)
        if: github.event_name == 'push'
        run: |
          echo "SHA_PATH=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Clamp SHA to Environment (Pull Request)
        if: github.event_name == 'pull_request'
        run : |
          echo "SHA_PATH=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Authorize gcloud CLI
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCS_KEYFILE_B64 }}
      - name: Set Up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Install Packages
        run: |
          sudo apt -y update
          sudo apt -y install wget
          sudo apt -y install jq
          sudo apt -y install python3
      - name: Download, Install, and Configure Aerolab
        run: |
          cd /tmp && wget https://github.com/aerospike/aerolab/releases/download/6.1.0/aerolab-linux-amd64-6.1.0.zip
          unzip aerolab-linux-amd64-6.1.0.zip -d /usr/local/bin/
          aerolab config backend -t gcp -o firefly-aerospike
      - name: Deploy Aerospike Cluster to GCP
        env:
          FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          echo $FEATURES_B64 | base64 -d > ${{ github.workspace }}/scripts/features.conf
          cd ${{ github.workspace }}/scripts && ./provision-aerospike-gcp.sh -c 3 -n ${{ env.SHA_PATH }} -o ../.github/aerospike/aerospike_l3.conf -f ./features.conf
      - name: Generate Hosts List for Deployed Cluster
        run: |
          aerolab cluster list -j | jq '.' > ${{ github.workspace }}/scripts/clusters.json
          cd ${{ github.workspace }}/scripts && python3 generate_l3_config.py ${{ env.SHA_PATH }}
      - name: Deploy Firefly Client Machine to GCP
        run: |
          aerolab client create base --zone=us-central1-a --disk=pd-ssd:40 --instance n2d-standard-8 -n ${{ env.SHA_PATH }}-firefly
          cd ${{ github.workspace }}/.. && tar -zcvf firefly.tgz ./firefly
          cd ${{ github.workspace }}/.. && gcloud compute scp --zone=us-central1-a ./firefly.tgz aerolab4-${{ env.SHA_PATH }}-firefly-1:firefly.tgz
          cd ${{ github.workspace }}/scripts && gcloud compute scp --zone=us-central1-a ./run-benchmark-gcp.sh aerolab4-${{ env.SHA_PATH }}-firefly-1:run-benchmark-gcp.sh
      - name: Build Bulk Loader JAR
        run: |
          cd ${{ github.workspace }} && mvn clean install -DskipTests
          ls -l ${{ github.workspace }}/scripts
          cd aerospike-graph-bulk-loader/target && for f in aerospike-graph-bulk-loader*; do mv -- "$f" "aerospike-graph-bulk-loader.jar"; done
      - name: Upload Bulk Loading Artifacts to GCP
        run: |
          gcloud storage cp ${{ github.workspace }}/scripts/l3_config.properties gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
          gcloud storage cp ${{ github.workspace }}/aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader.jar gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar
      - name: Run L3 Bulk Loading Job
        run: |
          cd ${{ github.workspace }}/scripts && ./bulk-load-dataproc.sh -n ci-${{ env.SHA_PATH }} -w 4 -j gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar -c gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
      - name: Archive L3 Bulk Loading Job Log
        if: success() || failure()
        run: |
          cd ${{ github.workspace }}/scripts
          mkdir ${{ env.YEAR }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}
          gcloud dataproc jobs wait ci-${{ env.SHA_PATH }}-job --region 'us-central1'> ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_job_metadata.txt 2>${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_job_log.txt
          gcloud storage mv gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_config.properties
      - name: Upload L3 Bulk Loading Job Log to GCP
        if: success() || failure()
        uses: google-github-actions/upload-cloud-storage@v1
        with:
          path: ${{ github.workspace }}/scripts/${{ env.YEAR }}
          destination: gha-ci-firefly-bulkloader/archive
          gzip: false
          process_gcloudignore: false
      - name: Run Benchmark on GCP
        run: |
          gcloud compute ssh --zone=us-central1-a aerolab4-${{ env.SHA_PATH }}-firefly-1 -- "sudo bash run-benchmark-gcp.sh"
      - name: Upload Benchmark Results
        run: |
          gcloud compute ssh --zone=us-central1-a aerolab4-${{ env.SHA_PATH }}-firefly-1 -- "sudo cat ./firefly/aerospike-graph-gremlin/target/benchmark.json" > benchmark.json
          gcloud storage cp benchmark.json gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/benchmark.json
      - name: Delete Firefly Compute Instances (Cleanup)
        if: always()
        run: |
          aerolab client destroy -f -n ${{ env.SHA_PATH }}-firefly
      - name: Delete Aerospike Compute Instances (Cleanup)
        if: always()
        run: |
          aerolab cluster destroy -f -n ${{ env.SHA_PATH }}
      - name: Delete Dataproc Clusters (Cleanup)
        if: always()
        run: |
          gcloud dataproc clusters delete --region us-central1 -q ci-${{ env.SHA_PATH }}
      - name: Delete Cloud Storage Artifacts (Cleanup)
        if: always()
        run: |
          gcloud storage rm -r gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}
  test-heap-usage:
    name: Test Firefly Heap Usage
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Memory Leak Test
        run: |
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyServer -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  benchmark-firefly:
    name: Benchmark Firefly
    timeout-minutes: 240
    needs: start-runner-benchmark
    runs-on: ${{ needs.start-runner-benchmark.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        run: |
          echo "Downloading gremlin-server"
          cd ..
          wget -O gremlin-server https://archive.apache.org/dist/tinkerpop/3.6.3/apache-tinkerpop-gremlin-server-3.6.3-bin.zip --quiet
          echo "Unzipping gremlin-server"
          unzip -qq gremlin-server
          
          echo "Build Firefly"
          cd firefly
          mvn clean install -DskipTests --no-transfer-progress
          
          echo "Installing Firefly in gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.3/bin/gremlin-server.sh install 'com.aerospike aerospike-graph-gremlin 1.1.0-SNAPSHOT'
          
          echo "Starting gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.3/bin/gremlin-server.sh /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &
          
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30
          
          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestFlightsData -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
