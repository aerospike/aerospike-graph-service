          security-group-id: sg-005fce4b475465f9e
  negative-test-bulk-loader-call-docker:
    name: Bulk Loader Call without Spark Fails
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Build Docker Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          bash -x scripts/build-docker-stripped.sh aerospike/firefly linux/amd64
          
          docker run -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/:/opt/aerospike-graph/custom/ \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-graph/etc/ \
            aerospike/firefly &
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemoteFailsWithoutSpark -DfailIfNoTests=false --no-transfer-progress
  test-heap-usage:
    name: Test Firefly Heap Usage
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Run Memory Leak Test
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyServer -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  benchmark-firefly:
    name: Benchmark Firefly
    timeout-minutes: 240
    needs: start-runner-benchmark
    runs-on: ${{ needs.start-runner-benchmark.outputs.label }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          echo "Downloading gremlin-server"
          cd ..
          wget -O gremlin-server https://archive.apache.org/dist/tinkerpop/3.7.1/apache-tinkerpop-gremlin-server-3.7.1-bin.zip --quiet
          echo "Unzipping gremlin-server"
          unzip -qq gremlin-server
          
          echo "Build Firefly"
          cd firefly
          mvn clean install -DskipTests --no-transfer-progress
          
          echo "Installing Firefly in gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.7.1/bin/gremlin-server.sh install 'com.aerospike aerospike-graph-gremlin 2.0.0-SNAPSHOT'
          
          echo "Starting gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.7.1/bin/gremlin-server.sh /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &
          
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30
          
          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestFlightsData -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  test-firefly-chainable-maven:
    name: Test Chainable Maven
    timeout-minutes: 120
    needs: start-chainable-maven-runner
    runs-on: ${{ needs.start-chainable-maven-runner.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Build maven
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          mvn install -DskipTests
      - name: Test Bulk Loader Maven
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
          GCS_KEYFILE_B64: ${{ secrets.GCS_KEYFILE_B64 }}
          GH_WORKSPACE: ${{ github.workspace}}
        run: |
          sudo echo $GCS_KEYFILE_B64 | base64 -d > ${{ github.workspace }}/gcs-keyfile.json
          mvn -pl aerospike-graph-bulk-loader test --no-transfer-progress
      - name: Test small memory Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyExceedHeap -DfailIfNoTests=false -Dintegration.test.properties=packed -Djvmheapsize=small --no-transfer-progress
      - name: Test TLS Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn -pl aerospike-graph-gremlin -Djavax.net.ssl.trustStore=$(realpath aerospike-graph-gremlin/src/test/resources/tls/trust-store.jks) -Djavax.net.ssl.keyStore=$(realpath aerospike-graph-gremlin/src/test/resources/tls/client.jks) -Djavax.net.ssl.trustStorePassword=abc123 -Djavax.net.ssl.keyStorePassword=abc123 -Dtest=TestTLSIntegration -Dintegration.test.properties=packed test --no-transfer-progress
      - name: Test Client Provider Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=ConcurrentClientProviderInstantiationTest -Dtest=TestAerospikeClientProviderConfiguration -DfailIfNoTests=false --no-transfer-progress
  test-firefly:
    name: Test Firefly
    timeout-minutes: 120
    needs: start-runner-test-firefly
    runs-on: ${{ needs.start-runner-test-firefly.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
