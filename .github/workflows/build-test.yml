    timeout-minutes: 30
    needs: build-firefly-maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly in Gremlin-Server and Test Prometheus
        run: |
          echo "Starting gremlin-server"
          bash -x scripts/build-docker.sh firefly linux/amd64
          
          echo "Running docker image with custom yaml file"
          docker run -p 8182:8182 -p 9090:9090 -v /home/runner/work/firefly/firefly/conf/test-custom-configs:/opt/aerospike-firefly/conf firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
