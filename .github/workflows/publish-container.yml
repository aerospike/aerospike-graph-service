name: Publish Aerospike Graph Release Candidate

# Publish the container if a tag of 'vX.Y.Z-rcW' is made.
# Example: v0.0.1-rc1, v0.1.0-rc2, v1.0.0-rc3, etc.
# THIS WILL NOT RUN ON TAGS WITHOUT A DASH IN THEM (release candidates only)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

env:
  GITHUB_REPOSITORY_NAME: citrusleaf
  GITHUB_IMAGE_NAME: firefly
  GITHUB_REGISTRY_URL: ghcr.io

jobs:

  publish-artifacts:
    name: Publish Artifacts
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Java 17 Install
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5

      - name: Build Bulk Loader
        run: |
          mvn clean install -DskipTests

      - name: Upload Bulk Loader
        uses: actions/upload-artifact@v3
        with:
          path: aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar

      - name: Upload Firefly
        uses: actions/upload-artifact@v3
        with:
          path: aerospike-graph-gremlin/target/aerospike-graph-gremlin*.jar

  publish-github:
    name: Publish Aerospike Graph Docker Image - GitHub - Release Candidate
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: publish-artifacts
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: |
          # Login to ghcr.io.
          echo ${{ secrets.CONTAINER_PUBLISH_PASSWORD }} | docker login $GITHUB_REGISTRY_URL --username ${{ secrets.CONTAINER_PUBLISH_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Download a Jar File
        uses: actions/download-artifact@v3

      - name: Publish Container
        run: |
          pip3 install python_on_whales
          
          # Make output directories.
          mkdir aerospike-graph-gremlin/target
          mkdir aerospike-graph-bulk-loader/target
          
          # Move the jar files to the target bin folders.
          mv artifact/aerospike-graph-gremlin-*.jar aerospike-graph-gremlin/target/
          mv artifact/aerospike-graph-bulk-loader-*.jar aerospike-graph-bulk-loader/target/
          
          # Strip git ref prefix (refs/tags or ref/heads).
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
  
          # Strip prefixed v if it is a tag.
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
  
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          UNSTABLE_INDICATOR="-"
          if [[ $( echo $VERSION | grep -c -i $UNSTABLE_INDICATOR ) -eq 0 ]]; then
            DOCKER_IMAGE=$GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:latest
            DOCKER_IMAGE=$(echo $DOCKER_IMAGE | tr '[A-Z]' '[a-z]')
            # Build and tag latest/unstable docker image. Note, we must push here since we cannot store the image in the cache since it isn't for our arch.
            echo "Building and tagging docker image for linux/amd64 and linux/arm64 $DOCKER_IMAGE $OUTPUT_IMAGE"
  
            # Switch back to 1.
            export EXTRA_BUILD_ARGS="--build-arg RELEASE_BUILD=0"
            python3 scripts/build-docker.py --tag $OUTPUT_IMAGE --platforms linux/amd64 --push
            python3 scripts/build-docker.py --tag $DOCKER_IMAGE --platforms linux/amd64 --push
          else
            DOCKER_IMAGE=$GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:unstable
            DOCKER_IMAGE=$(echo $DOCKER_IMAGE | tr '[A-Z]' '[a-z]')
            # Build and tag latest/unstable docker image. Note, we must push here since we cannot store the image in the cache since it isn't for our arch.
            echo "Building and tagging docker image for linux/amd64 $DOCKER_IMAGE $OUTPUT_IMAGE"

            python3 scripts/build-docker.py --tag $DOCKER_IMAGE --platforms linux/amd64 --push
            python3 scripts/build-docker.py --tag $OUTPUT_IMAGE --platforms linux/amd64 --push
          fi
          echo "OUTPUT_IMAGE=$OUTPUT_IMAGE" >> $GITHUB_ENV
