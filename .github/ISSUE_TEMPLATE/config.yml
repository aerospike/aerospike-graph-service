blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/aerospike/aerospike-graph-service/security/advisories/new
    about: >-
      Please do not file security issues as public GitHub issues. Use the
      private security advisory flow, or email security@aerospike.com.
      See SECURITY.md for details.
  - name: Usage questions / support
    url: https://github.com/aerospike/aerospike-graph-service/discussions
    about: >-
      Questions about how to use AerospikeGraphService, traversal
      patterns, performance tuning, and other how-to content belong in
      Discussions, not Issues.
  - name: Aerospike database (server) bugs
    url: https://aerospike.com/support
    about: >-
      If the bug is in the Aerospike database itself and not in this
      graph service, report it to Aerospike directly.
