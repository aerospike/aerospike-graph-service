        run: |
          bash -x scripts/start_aerospike.sh
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dintegration.test.properties=packed -Dtest=Firefly*StructureStandardTest --no-transfer-progress
  test-firefly-process-1:
    name: Test Firefly Process Tests 1
    timeout-minutes: 120
    needs: start-runner-test-firefly-process-1
    runs-on: ${{ needs.start-runner-test-firefly-process-1.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Test with Maven
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
