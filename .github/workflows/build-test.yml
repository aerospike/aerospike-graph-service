name: Build and Test Firefly

on:
  push:
    branches: [main,test-ready]
  pull_request:
    branches: [main,test-ready]

# Firefly has the following jobs:
# - Build Firefly Maven
# - Build Firefly Docker
# - Test Spark Bulk Loader
# - Test Packed Data Model
# - Test Star Packed Data Model

jobs:
  start-runner-build:
    name: Start Build Runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  build-firefly-maven:
    name: Build Firefly Maven
    needs: start-runner-build
    timeout-minutes: 120
    runs-on: ${{ needs.start-runner-build.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build Maven Project
        run: |
          mvn clean package -DskipTests --no-transfer-progress
  stop-runner-build:
    name: Stop Build Runner
    needs:
      - build-firefly-maven
      - start-runner-build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner-build.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner-build.outputs.ec2-instance-id }}
  start-runner-tls:
    name: Start TLS Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-packed:
    name: Start Packed Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-packed-sindex:
    name: Start Packed Sindex Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-movielens-packed:
    name: Start Movielens Packed Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-small-memory-packed:
    name: Start Small Memory Packed Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-docker:
    name: Start Docker Build Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-spark-bulk-loader:
    name: Start Spark Bulk Loader Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-0d006286a6209f4bc
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  build-firefly-docker:
    name: Build Firefly Docker
    timeout-minutes: 120
    needs: start-runner-docker
    runs-on: ${{ needs.start-runner-docker.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          java -XX:+PrintFlagsFinal -version | grep HeapSize
          docker build -t aerospike/firefly .
  test-firefly-tls:
    name: Test TLS integration
    timeout-minutes: 12
    needs: start-runner-tls
    runs-on: ${{ needs.start-runner-tls.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn -DskipTests clean compile test-compile package
          mvn -pl firefly-gremlin -Djavax.net.ssl.trustStore=$(realpath firefly-gremlin/src/test/resources/tls/trust-store.jks) -Djavax.net.ssl.keyStore=$(realpath firefly-gremlin/src/test/resources/tls/client.jks) -Djavax.net.ssl.trustStorePassword=abc123 -Djavax.net.ssl.keyStorePassword=abc123 -Dtest=TestTLSIntegration -Dintegration.test.properties=packed test --no-transfer-progress

  test-firefly-packed:
    name: Test Packed
    timeout-minutes: 120
    needs: start-runner-packed
    runs-on: ${{ needs.start-runner-packed.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn -pl firefly-gremlin  -Dintegration.test.properties=packed test --no-transfer-progress
  test-firefly-packed-sindex:
    name: Test Packed Sindex
    timeout-minutes: 120
    needs: start-runner-packed-sindex
    runs-on: ${{ needs.start-runner-packed-sindex.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn -pl firefly-gremlin  -Dintegration.test.properties=packed-sindex test --no-transfer-progress
  test-firefly-movielens-packed:
    name: Test Movielens Packed
    timeout-minutes: 120
    needs: start-runner-movielens-packed
    runs-on: ${{ needs.start-runner-movielens-packed.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl firefly-gremlin -Dtest=TestMovielens1M -DfailIfNoTests=false -Dintegration.test.properties=packed --no-transfer-progress
  test-firefly-small-memory-packed:
    name: Test Small Memory Packed
    timeout-minutes: 120
    needs: start-runner-small-memory-packed
    runs-on: ${{ needs.start-runner-small-memory-packed.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl firefly-gremlin  -Dtest=TestFireflyExceedHeap -DfailIfNoTests=false -Dintegration.test.properties=packed -Djvmheapsize=small --no-transfer-progress
  test-firefly-spark-bulk-loader:
    name: Test Spark Bulk Loader
    timeout-minutes: 15
    needs: start-runner-spark-bulk-loader
    runs-on: ${{ needs.start-runner-spark-bulk-loader.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          mvn clean install -DskipTests
          mvn -pl firefly-spark-bulk-loader  test --no-transfer-progress
  benchmark-firefly:
    name: Benchmark Firefly
    timeout-minutes: 240
    needs: build-firefly-maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        run: |
          echo "Downloading gremlin-server"
          cd ..
          wget -O gremlin-server https://dlcdn.apache.org/tinkerpop/3.6.1/apache-tinkerpop-gremlin-server-3.6.1-bin.zip --quiet
          echo "Unzipping gremlin-server"
          unzip -qq gremlin-server
          
          echo "Build Firefly"
          cd firefly
          mvn clean install -DskipTests --no-transfer-progress
          
          echo "Installing Firefly in gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.1/bin/gremlin-server.sh install 'com.aerospike firefly-gremlin 0.6.0-SNAPSHOT'
          
          echo "Starting gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.1/bin/gremlin-server.sh /home/runner/work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &
          
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30
          
          echo "Running benchmark"
          mvn test -pl firefly-gremlin  -Dtest=BenchmarkTestFlightsData -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: firefly-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  test-docker-with-custom-yaml:
    name: Test Docker Image with Custom yaml
    timeout-minutes: 30
    needs: build-firefly-maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly Docker Image with Custom yaml
        run: |
          echo "Starting gremlin-server"
          docker build -t firefly .
          
          echo "Running docker image with custom yaml file"
          docker run -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs:/opt/aerospike-firefly/conf firefly &

          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl firefly-gremlin -Dtest=ValidConnectionTest -DfailIfNoTests=false --no-transfer-progress
  test-docker-with-custom-properties:
    name: Test Docker Image with Custom properties
    timeout-minutes: 30
    needs: build-firefly-maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v4
        with:
          server-version: 6.1.0.3
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /home/runner/work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly Docker Image with Custom properties
        run: |
          echo "Starting gremlin-server"
          docker build -t firefly .
          
          echo "Running docker image with custom properties file"
          docker run -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs/firefly-graph.properties:/opt/aerospike-firefly/conf/firefly-graph.properties firefly &

          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl firefly-gremlin  -Dtest=ValidConnectionTest -DfailIfNoTests=false --no-transfer-progress
  stop-runner-movielens-packed:
    name: Stop Movielens Packed Runner
    needs:
      - test-firefly-movielens-packed
      - start-runner-movielens-packed
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner-movielens-packed.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner-movielens-packed.outputs.ec2-instance-id }}
  stop-runner-small-memory-packed:
    name: Stop Small Memory Packed Runner
    needs:
      - test-firefly-small-memory-packed
      - start-runner-small-memory-packed
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner-small-memory-packed.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner-small-memory-packed.outputs.ec2-instance-id }}
  stop-runner-packed:
    name: Stop Packed Runner
    needs:
      - test-firefly-packed
      - start-runner-packed
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner-packed.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner-packed.outputs.ec2-instance-id }}
  stop-runner-packed-sindex:
    name: Stop Packed Sindex Runner
    needs:
      - test-firefly-packed-sindex
      - start-runner-packed-sindex
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Stop EC2 runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: stop
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
