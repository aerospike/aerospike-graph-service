name: Build and Test Aerospike Graph Service (Extended)

# Run extended tests after merges to 3.x-dev and on PRs into 3.x-snyk.

on:
  push:
    branches: [3.x-dev]
  pull_request:
    branches: [3.x-snyk]

jobs:
  test-heap-usage:
    name: Test Firefly Heap Usage
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set Up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set Up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.5
      - name: Run Memory Leak Test
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyServer --no-transfer-progress
  benchmark-firefly:
    name: Benchmark Firefly
    timeout-minutes: 240
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set Up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set Up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.5
      - name: Launch Firefly and Run Benchmark
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh

          echo "Build Firefly"
          mvn clean install -DskipTests --no-transfer-progress

          echo "Starting firefly-server"
          graph_jar=$(echo aerospike-graph-gremlin/target/aerospike-graph-gremlin-*.jar)
          bulk_loader_jar=$(echo aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar)
          java -cp "$graph_jar:$bulk_loader_jar" com.aerospike.firefly.runtime.FireflyServer ${{ github.workspace }}/conf/firefly-gremlin-server-github-actions.yaml &

          echo "Sleeping for 10 seconds while firefly-server starts"
          sleep 10

          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestFlightsData --no-transfer-progress
  test-firefly-spark-bulk-loader-load-recovery-1-1:
    name: Spark Bulk Loader Load Recovery (1-1)
    timeout-minutes: 80
