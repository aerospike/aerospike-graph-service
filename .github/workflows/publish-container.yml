name: Publish Firefly Container

# Publish the container if a tag of 'v*' is made.
# Example: v0.0.1, v0.1.0, v1.0.0, etc.
on:
  # TODO: Remove pull_request: branches: [main]. This is for testing only.
  pull_request:
    branches: [main]
  #push:
  #  tags:
  #    - 'v*'

env:
  REPOSITORY_NAME: aerospike
  IMAGE_NAME: firefly
  VERSION: v0.0.1

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  build:
    name: build-firefly-docker
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CONTAINER_PUBLISH_USERNAME }}
          password: ${{ secrets.CONTAINER_PUBLISH_PASSWORD }}

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Container
        run: |
      # - if: $CI_PIPELINE_SOURCE == "push"
      # - name: Push Container
      #   run: |
      #     docker push $REPOSITORY_NAME/$IMAGE_NAME

      - name: Publish Container
        run: |
          # Get image id.
          IMAGE_ID=ghcr.io/$REPOSITORY_NAME/$IMAGE_NAME
          
          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          
          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          
          # Use Docker `latest` tag convention
          [ "$VERSION" == "main" ] && VERSION=latest
          
          # Print out the image id and version.
          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          
          echo "Building mvn package"
          mvn -DskipTests clean package --no-transfer-progress
          
          echo "Building docker image"
          docker build -t $REPOSITORY_NAME/$IMAGE_NAME
          
          # Create docker tag.
          echo "Creating docker tag"
          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          
          # Push Docker tag.
          echo "Pushing docker tag"
          docker push $IMAGE_ID:$VERSION
