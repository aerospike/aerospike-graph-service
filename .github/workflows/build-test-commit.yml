  test-chainable-docker:
    name: Test Chainable Docker
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build docker
        run: |
          pip3 install python_on_whales
          echo "Building docker image"
          python3 scripts/build-docker.py --tags firefly --platforms linux/amd64
          python3 scripts/build-docker.py --tags firefly-slim --platforms linux/amd64 --use_local --slim
      # Due to the nature of the multi usage stats test, it MUST come first. Otherwise it will have problems.
      - name: Run multi Firefly usage test
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh

          echo "Running docker image with custom yaml file"
          docker run -d -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs-usage-stats/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly
          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10
          
          echo "Running usage test"
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyUsageStatsCallMultiTest --no-transfer-progress
          
          echo "Stopping docker image"
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Image Secret Masking
        # This test does not need to stop the image because SSL is not configured properly, so it errors and exits but the test serves its purpose regardless.
        run: |
          echo "Running docker image with secrets"
          docker run -d --name firefly -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-secret-masking/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties -e JAVA_OPTIONS="-Djavax.net.ssl.trustStore=/root/aerospike/truststore.jks -Djavax.net.ssl.keyStore=/root/aerospike/keystore.jks -Djavax.net.ssl.trustStorePassword=simon123 -Djavax.net.ssl.keyStorePassword=simon123" firefly
          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10

          echo "Showing docker image logging..."
          docker logs firefly
          echo "Running secret masking test script"
          bash scripts/test-secret-masking.sh
      - name: Launch Firefly Docker Image with Custom yaml
        run: |
          echo "Running docker image with custom yaml file"
          docker run -d -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs:/opt/aerospike-graph/custom firefly
          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10
          
          echo "Running connection test"
          mvn test -pl aerospike-graph-gremlin -Dtest=ValidConnectionTest --no-transfer-progress
          
          echo "Stopping docker image"
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Launch Firefly Docker Image with Custom properties
        run: |
          echo "Running docker image with custom properties file"
          docker run -d -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly

          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10

          echo "Running ValidConnectionTest"
          mvn test -pl aerospike-graph-gremlin -Dtest=ValidConnectionTest --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Image with Security Enabled
        run: |
          echo "Running docker image with security enabled"
          docker run -d -p 8182:8182 -p 9090:9090 -v /home/runner/work/firefly/firefly/conf/test-security/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties -e aerospike.graph.audit.log.enabled=true firefly
          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10

          echo "Running Security Test"
          mvn test -pl aerospike-graph-gremlin -Dtest=JwtAuthenticationDockerTest --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Image with Default Prometheus
        run: |
          echo "Running docker image with prometheus"
          docker run -d -p 8182:8182 -p 9090:9090 -v /home/runner/work/firefly/firefly/conf/test-custom-configs/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly
          echo "Sleeping for 10 seconds while gremlin-server starts"
          sleep 10

          echo "Running Prometheus Test"
          mvn test -pl aerospike-graph-gremlin -Dtest=PrometheusExporterTest --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Image Bulk Loader Call
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
        run: |
          docker run -d -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-graph/etc/ \
            firefly
          
          echo "Sleeping for 10 seconds while docker image starts"
          sleep 10
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemote --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Runtime (Default Config)
        run: |
          docker run -d -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            firefly
          
          echo "Sleeping for 10 seconds while docker image starts"
          sleep 10
          
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyMergeEdgeStepRemoteTest --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestTxDisabled --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Runtime (Scan Disabled)
        run: |
          docker run -d -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/aerospike-graph-scan-disabled.properties:/opt/aerospike-graph/aerospike-graph.properties \
            firefly
          
          echo "Sleeping for 10 seconds while docker image starts"
          sleep 10
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestScanDisabledDocker --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
      - name: Test Firefly Docker Image
        run: |
          echo "Running performance mode tests"
          mvn test -pl aerospike-graph-gremlin -Dtest=TestPerformanceModes --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerJavaOptions --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerConfigs --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestSlimVsFat --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerShutdown --no-transfer-progress
