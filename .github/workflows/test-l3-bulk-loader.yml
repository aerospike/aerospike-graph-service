name: Validate L3 Spark Bulk Loading

on:
  pull_request:
    branches: [3.x-snyk]

jobs:
  ci-guard:
    # Fork-safe / label-gated gate. Downstream jobs depend on this via
    # `needs: ci-guard`, so on fork PRs that lack the `trusted-ci`
    # label this job fails fast and the rest of the workflow is
    # skipped, keeping AWS/GCS/license secrets out of reach.
    name: CI Guard (Fork + Label Check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Enforce Fork and Label Policy
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT) — ci-guard allows."
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Same-repo PR ($HEAD_REPO) — ci-guard allows."
            exit 0
          fi
          if grep -q '"trusted-ci"' <<<"$LABELS"; then
            echo "Fork PR carries 'trusted-ci' label — ci-guard allows."
            exit 0
          fi
          echo "::error::Fork PRs must carry the 'trusted-ci' label before"
          echo "::error::CI with secrets will run. A maintainer will add the"
          echo "::error::label after reviewing the diff. See CONTRIBUTING.md."
          exit 1

  run-l3-bulk-loader-pe:
    name: L3 Spark Bulk Loader Phantom Edge Test (GCP)
    timeout-minutes: 150
    runs-on: ubuntu-latest
    needs: ci-guard
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Install Packages
        run: |
          sudo apt -y update
          sudo apt -y install wget
          sudo apt -y install jq
          sudo apt -y install python3
      - name: Generate Properties File from Benchmark Configuration
        run: |
          sudo python3 scripts/parse_benchmark_tag.py benchmark-synthetic-1g
      - name: Resolve Run SHA (Push)
        if: github.event_name == 'push'
        run: |
          echo "SHA_PATH=${GITHUB_SHA::7}-pe" >> $GITHUB_ENV
      - name: Resolve Run SHA (Pull Request)
        if: github.event_name == 'pull_request'
        run: |
          echo "SHA_PATH=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)-pe" >> $GITHUB_ENV
      - name: Read Workflow Configuration from Properties File
        id: read_property
        run: |
          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < benchmark.properties
      - name: Authorize gcloud CLI
        uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
        with:
          workload_identity_provider: projects/1026366180403/locations/global/workloadIdentityPools/github-actions/providers/github-ags
          service_account: ${{ secrets.GCS_CLIENT_EMAIL }}
      - name: Set Up gcloud CLI
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1
      - name: Set Up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set Up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.5
      - name: Download Benchmark Configuration from GCP
        run: |
          gcloud storage cp gs://incremental-datasets/${{ steps.read_property.outputs.benchmark }}/config_base.properties ${{ github.workspace }}/scripts/l3_config_base.properties
      - name: Download, Install, and Configure Aerolab
        run: |
          cd /tmp && wget https://github.com/aerospike/aerolab/releases/download/7.10.1/aerolab-linux-amd64-7.10.1.zip
          unzip aerolab-linux-amd64-7.10.1.zip -d /usr/local/bin/
          aerolab config backend -t gcp -o "$GCP_PROJECT_ID"
      - name: Deploy Aerospike Cluster to GCP
        env:
          FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          echo $FEATURES_B64 | base64 -d > ${{ github.workspace }}/scripts/features.conf
          cd ${{ github.workspace }}/scripts && ./provision-aerospike-gcp.sh -i ${{ steps.read_property.outputs.instance-type }} -a ${{ steps.read_property.outputs.storage-type }} -s ${{ steps.read_property.outputs.ssd-count }} -c ${{ steps.read_property.outputs.server-instances }} -n ${{ env.SHA_PATH }} -o ../.github/aerospike/aerospike_l3.conf -f ./features.conf
      - name: Generate Hosts List and Config for Deployed Cluster
        run: |
          aerolab cluster list -j | jq '.' > ${{ github.workspace }}/scripts/clusters.json
          cd ${{ github.workspace }}/scripts && python3 generate_l3_config.py ${{ env.SHA_PATH }} ${{ steps.read_property.outputs.data-size }} ${{ steps.read_property.outputs.benchmark }}
      - name: Provision Graph Service Test Client
        run: |
          aerolab client create none --zone=us-central1-a --disk=pd-ssd:40 --instance c3d-standard-8 --gcp-expire 0 -n ${{ env.SHA_PATH }}-firefly
          cd ${{ github.workspace }}/.. && tar -zcvf firefly.tgz ./aerospike-graph-service
          cd ${{ github.workspace }}/.. && gcloud compute scp --zone=us-central1-a ./firefly.tgz aerolab4-${{ env.SHA_PATH }}-firefly-1:firefly.tgz
          cd ${{ github.workspace }}/scripts && gcloud compute scp --zone=us-central1-a ./run-phantom-edge-test-gcp.sh aerolab4-${{ env.SHA_PATH }}-firefly-1:run-phantom-edge-test-gcp.sh
      - name: Build Bulk Loader JAR
        run: |
          cd ${{ github.workspace }} && mvn clean install -DskipTests
          cd aerospike-graph-bulk-loader/target && for f in aerospike-graph-bulk-loader*; do mv -- "$f" "aerospike-graph-bulk-loader.jar"; done
      - name: Upload Bulk Loading Artifacts to GCP
        run: |
          gcloud storage cp ${{ github.workspace }}/scripts/l3_config.properties gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
          gcloud storage cp ${{ github.workspace }}/aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader.jar gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar
      - name: Run L3 Bulk Loading Job
        run: |
          cd ${{ github.workspace }}/scripts && ./bulk-load-dataproc-pe.sh -n ci-${{ env.SHA_PATH }} -w 5 -j gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar -c gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
      - name: Run Phantom Edge Test on GCP
        run: |
          gcloud compute ssh --zone=us-central1-a aerolab4-${{ env.SHA_PATH }}-firefly-1 -- "sudo bash run-phantom-edge-test-gcp.sh"
      - name: Remove Graph Service Test Client (Cleanup)
        if: always()
        run: |
          aerolab client destroy -f -n ${{ env.SHA_PATH }}-firefly
      - name: Delete Aerospike Compute Instances (Cleanup)
        if: always()
        run: |
          aerolab cluster destroy -f -n ${{ env.SHA_PATH }}
      - name: Delete Dataproc Clusters (Cleanup)
        if: always()
        run: |
          gcloud dataproc clusters delete --region us-central1 -q ci-${{ env.SHA_PATH }}
      - name: Delete Dataproc Job (Cleanup)
        if: always()
        run: |
          gcloud dataproc jobs delete --region us-central1 -q ci-${{ env.SHA_PATH }}-job
      - name: Delete Cloud Storage Artifacts (Cleanup)
        if: always()
        run: |
          gcloud storage rm -r gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}
  run-l3-bulk-loader:
    name: L3 Spark Bulk Loader Benchmark (GCP)
    timeout-minutes: 150
    runs-on: ubuntu-latest
    needs: ci-guard
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Install Packages
        run: |
          sudo apt -y update
          sudo apt -y install wget
          sudo apt -y install jq
          sudo apt -y install python3
      - name: Generate Properties File from Benchmark Tag
        run: |
          sudo python3 scripts/parse_benchmark_tag.py benchmark-synthetic-1g
      - name: Clamp Runtime Variables to Environment
        run: |
          echo "YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "MONTH=$(date +%m)" >> $GITHUB_ENV
          echo "DAY=$(date +%d)" >> $GITHUB_ENV
      - name: Resolve Run SHA (Push)
        if: github.event_name == 'push'
        run: |
          echo "SHA_PATH=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Resolve Run SHA (Pull Request)
        if: github.event_name == 'pull_request'
        run : |
          echo "SHA_PATH=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_ENV
      - name: Read Workflow Configuration from Properties File
        id: read_property
        run: |
          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done < benchmark.properties
      - name: Authorize gcloud CLI
        uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
        with:
          workload_identity_provider: projects/1026366180403/locations/global/workloadIdentityPools/github-actions/providers/github-ags
          service_account: ${{ secrets.GCS_CLIENT_EMAIL }}
      - name: Set Up gcloud CLI
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1
      - name: Set Up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set Up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.5
      - name: Download Benchmark Configuration from GCP
        run: |
          gcloud storage cp gs://incremental-datasets/${{ steps.read_property.outputs.benchmark }}/config_base.properties ${{ github.workspace }}/scripts/l3_config_base.properties
          gcloud storage cp gs://incremental-datasets/${{ steps.read_property.outputs.benchmark }}/benchmark_name.txt ${{ github.workspace }}/benchmark_name.txt
      - name: Download, Install, and Configure Aerolab
        run: |
          cd /tmp && wget https://github.com/aerospike/aerolab/releases/download/7.10.1/aerolab-linux-amd64-7.10.1.zip
          unzip aerolab-linux-amd64-7.10.1.zip -d /usr/local/bin/
          aerolab config backend -t gcp -o "$GCP_PROJECT_ID"
      - name: Deploy Aerospike Cluster to GCP
        env:
          FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          echo $FEATURES_B64 | base64 -d > ${{ github.workspace }}/scripts/features.conf
          cd ${{ github.workspace }}/scripts && ./provision-aerospike-gcp.sh -i ${{ steps.read_property.outputs.instance-type }} -a ${{ steps.read_property.outputs.storage-type }} -s ${{ steps.read_property.outputs.ssd-count }} -c ${{ steps.read_property.outputs.server-instances }} -n ${{ env.SHA_PATH }} -o ../.github/aerospike/aerospike_l3.conf -f ./features.conf
      - name: Generate Hosts List and Config for Deployed Cluster
        run: |
          aerolab cluster list -j | jq '.' > ${{ github.workspace }}/scripts/clusters.json
          cd ${{ github.workspace }}/scripts && python3 generate_l3_config.py ${{ env.SHA_PATH }} ${{ steps.read_property.outputs.data-size }} ${{ steps.read_property.outputs.benchmark }}
          cd ${{ github.workspace }} && gcloud storage cp ${{ github.workspace }}/benchmark.properties gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/ci.properties
      - name: Provision Graph Service Benchmark Client
        run: |
          aerolab client create none --zone=us-central1-a --disk=pd-ssd:40 --instance c3d-standard-8 --gcp-expire 0 -n ${{ env.SHA_PATH }}-firefly
          cd ${{ github.workspace }} && echo ${{ steps.read_property.outputs.data-size }} >> data_size.txt
          cd ${{ github.workspace }} && echo ${{ steps.read_property.outputs.storage-type }} >> storage_type.txt
          cd ${{ github.workspace }}/.. && tar -zcvf firefly.tgz ./aerospike-graph-service
          cd ${{ github.workspace }}/.. && gcloud compute scp --zone=us-central1-a ./firefly.tgz aerolab4-${{ env.SHA_PATH }}-firefly-1:firefly.tgz
          cd ${{ github.workspace }}/scripts && gcloud compute scp --zone=us-central1-a ./run-benchmark-gcp.sh aerolab4-${{ env.SHA_PATH }}-firefly-1:run-benchmark-gcp.sh
      - name: Build Bulk Loader JAR
        run: |
          cd ${{ github.workspace }} && mvn clean install -DskipTests
          cd aerospike-graph-bulk-loader/target && for f in aerospike-graph-bulk-loader*; do mv -- "$f" "aerospike-graph-bulk-loader.jar"; done
      - name: Upload Bulk Loading Artifacts to GCP
        run: |
          gcloud storage cp ${{ github.workspace }}/scripts/l3_config.properties gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
          gcloud storage cp ${{ github.workspace }}/aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader.jar gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar
      - name: Run L3 Bulk Loading Job
        run: |
          cd ${{ github.workspace }}/scripts && ./bulk-load-dataproc.sh -n ci-${{ env.SHA_PATH }} -w 4 -j gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/aerospike-graph-bulk-loader.jar -c gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties
          cd ${{ github.workspace }} && jq -n --arg name L3_${{ steps.read_property.outputs.data-size }}_${{ steps.read_property.outputs.storage-type }}_${{ steps.read_property.outputs.instance-type }}_${{ steps.read_property.outputs.server-instances }}-node --arg runtime $(cat ./scripts/l3_runtime.txt) '[{"name":$name, "unit":"Minutes", "value":$runtime|tonumber}]' > l3_benchmark.json
          gcloud storage cp ${{ github.workspace }}/l3_benchmark.json gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_benchmark.json
      - name: Archive L3 Bulk Loading Job Log
        if: success() || failure()
        run: |
          cd ${{ github.workspace }}/scripts
          mkdir ${{ env.YEAR }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}
          mkdir ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}
          gcloud dataproc jobs wait ci-${{ env.SHA_PATH }}-job --region 'us-central1'> ${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_job_metadata.txt 2>${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_job_log.txt
          gcloud storage mv gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}/l3_config.properties gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/l3_config.properties
      - name: Upload L3 Bulk Loading Job Log to GCP
        if: success() || failure()
        uses: google-github-actions/upload-cloud-storage@e95a15f226403ed658d3e65f40205649f342ba2c # v1.0.3
        with:
          path: ${{ github.workspace }}/scripts/${{ env.YEAR }}
          destination: gha-ci-firefly-bulkloader/archive
          gzip: false
          process_gcloudignore: false
      - name: Run Graph Service Benchmark
        run: |
          gcloud compute ssh --zone=us-central1-a aerolab4-${{ env.SHA_PATH }}-firefly-1 -- "sudo bash run-benchmark-gcp.sh"
      - name: Archive Graph Service Benchmark Results
        run: |
          gcloud compute ssh --zone=us-central1-a aerolab4-${{ env.SHA_PATH }}-firefly-1 -- "sudo cat ./aerospike-graph-service/aerospike-graph-gremlin/target/benchmark.json" > ${{ github.workspace }}/aerospike-graph-gremlin/target/benchmark.json
          gcloud storage cp ${{ github.workspace }}/aerospike-graph-gremlin/target/benchmark.json gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/benchmark.json
      - name: Remove Graph Service Benchmark Client (Cleanup)
        if: always()
        run: |
          aerolab client destroy -f -n ${{ env.SHA_PATH }}-firefly
      - name: Collect Aerospike Server Logs on Failure
        if: failure()
        run: |
          aerolab logs get -n ${{ env.SHA_PATH }} --journal
          gcloud storage mv logs gs://gha-ci-firefly-bulkloader/archive/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ env.SHA_PATH }}/aerospike-server-log
      - name: Delete Aerospike Compute Instances (Cleanup)
        if: always()
        run: |
          aerolab cluster destroy -f -n ${{ env.SHA_PATH }}
      - name: Delete Dataproc Clusters (Cleanup)
        if: always()
        run: |
          gcloud dataproc clusters delete --region us-central1 -q ci-${{ env.SHA_PATH }}
      - name: Delete Dataproc Job (Cleanup)
        if: always()
        run: |
          gcloud dataproc jobs delete --region us-central1 -q ci-${{ env.SHA_PATH }}-job
      - name: Delete Cloud Storage Artifacts (Cleanup)
        if: always()
        run: |
          gcloud storage rm -r gs://gha-ci-firefly-bulkloader/${{ env.SHA_PATH }}
