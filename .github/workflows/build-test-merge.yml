  benchmark-firefly:
    name: Benchmark Firefly
    timeout-minutes: 240
    needs: start-runner-benchmark
    runs-on: ${{ needs.start-runner-benchmark.outputs.label }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Launch Firefly and Run Benchmark
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          
          echo "Build Firefly"
          mvn clean install -DskipTests --no-transfer-progress                    
          
          echo "Starting firefly-server"
          graph_jar=$(echo aerospike-graph-gremlin/target/aerospike-graph-gremlin-*.jar)
          bulk_loader_jar=$(echo aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar)
          java -cp "$graph_jar:$bulk_loader_jar" com.aerospike.firefly.runtime.FireflyServer /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &
          
          echo "Sleeping for 30 seconds while firefly-server starts"
          sleep 30
          
          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestFlightsData -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
