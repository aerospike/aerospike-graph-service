        run: |
          bash -x scripts/start_aerospike_mrt.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestMRTSupported --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestAerospikeOperations --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyMRTFeatureTest --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyTxFeatureTest --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyTxMRTFeatureTest --no-transfer-progress
  test-tinkerpop-tx:
    needs: ci-guard
    name: Test Tinkerpop Transactions
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build docker
        run: |
          pip3 install python_on_whales
          echo "Building docker image"
          python3 scripts/build-docker.py --tags firefly --platforms linux/amd64
      - name: Run Tinkerpop Transaction Tests
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike_mrt.sh
          
          echo "Running docker image with transactions enabled"
          docker run -d -p 8182:8182  \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            -v ${{ github.workspace }}/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -e aerospike.graph.tx.enabled=true firefly

          bash scripts/wait_for_gremlin_server.sh
          
          echo "Running Tinkerpop transactions test"
          mvn test -pl aerospike-graph-gremlin -Dtest=TestTinkerpopTransactions --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestTransactionSummary --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          sleep 10
          mvn test -pl aerospike-graph-gremlin -Dtest=TestTinkerpopTransactionTimeout --no-transfer-progress
      - name: Test Multi Node AGS Transactions
        run: |
          echo "Running multi node transaction test"
          
          docker run -d -p 8182:8182  \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            -v ${{ github.workspace }}/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -e aerospike.graph.tx.enabled=true firefly
          docker run -d -p 8183:8182  \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            -v ${{ github.workspace }}/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -e aerospike.graph.tx.enabled=true firefly
          docker run -d -p 8184:8182  \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            -v ${{ github.workspace }}/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -e aerospike.graph.tx.enabled=true firefly
          bash scripts/wait_for_gremlin_server.sh 127.0.0.1 8182
          bash scripts/wait_for_gremlin_server.sh 127.0.0.1 8183
          bash scripts/wait_for_gremlin_server.sh 127.0.0.1 8184
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestMultiNodeTransaction --no-transfer-progress
  test-firefly-process-1:
    name: Test Firefly Process Tests 1
    timeout-minutes: 120
    needs: ci-guard
