aerospike.client.host=172.17.0.1:3000
aerospike.graph-service.ssl.enabled=true
# Paths below are resolved relative to the repository root by the test harness.
# Test-only password: matches the throwaway keystore generated for CI/integration tests.
# Do NOT reuse in a real deployment - generate your own keystore with a strong, unique password.
aerospike.graph-service.ssl.keyStore=.github/aerospike/tls/keystore.jks
aerospike.graph-service.ssl.keyStorePassword=changeit
#aerospike.graph-service.ssl.trustStore=.github/aerospike/tls/truststore.jks
#aerospike.graph-service.ssl.trustStorePassword=changeit
aerospike.graph-service.auth.jwt.secret=test_jwt_secret
aerospike.graph-service.auth.jwt.issuer=aerospike
