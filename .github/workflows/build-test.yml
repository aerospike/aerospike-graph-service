  stop-runner-docker:
    name: Stop Docker Build Runner
    needs:
      - build-firefly-docker
      - start-runner-docker
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
