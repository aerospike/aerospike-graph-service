# Publish Aerospike Graph Service artifacts to JFrog via the shared-workflows pipeline.
#
# Two triggers, one pipeline:
#
#   push (vX.Y.Z[-rcN])  A real release. The tagged commit was already tested at PR time, so
#                        this builds, signs, deploys, and bundles. It does not re-run the EC2
#                        test fleet (see the commented-out `test` gate below).
#
#   workflow_dispatch    A manual smoke run, for proving the pipeline without spending a
#                        release tag. Takes NO version input: a free-text version would let
#                        any run overwrite a shipped release, and it silently becomes the
#                        image tag, the chart version, and the bundle version. Instead the
#                        version is derived as <pom version minus -SNAPSHOT>-dev.<run_number>,
#                        which is unique per run and unmistakably not a release. It publishes
#                        real artifacts (that is the point: OIDC is what needs proving) but
#                        skips the release bundle, so no throwaway bundles accumulate and no
#                        dev-local artifact gets locked by one.
#
# Produces, all under the `connect` JFrog project:
#   - the multi-arch container (full + slim) -> connect-docker-dev-local
#   - the graph + bulk-loader uber JARs       -> connect-maven-dev-local
#   - the graphservice Helm chart             -> connect-helm-dev-local
# then, on a tag only, assembles a release bundle (aerospike-graph-service) for DEV -> PROD
# promotion. On PROD promotion the existing artifact-publisher automation mirrors the image to
# Docker Hub.
name: publish-ags

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Unlisted scopes become none, and a nested workflow cannot request more than the caller grants.
# This is the union the pinned call tree needs.
permissions:
  id-token: write       # OIDC to JFrog
  contents: read
  packages: write       # container push
  attestations: write   # SBOM + SLSA provenance

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-release: ${{ steps.v.outputs.is-release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # required, or extract-version falls back to 0.0.0-dev+<sha>
      - id: tag
        if: github.event_name == 'push'
        uses: aerospike/shared-workflows/.github/actions/extract-version-from-tag@57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
      - name: Resolve the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="$TAG_VERSION"
            case "$version" in
              "" | 0.0.0-dev*)
                echo "::error::version did not resolve from the tag (got '$version'); need fetch-depth: 0 and a vX.Y.Z tag"
                exit 1
                ;;
            esac
            is_release=true
          else
            # Manual run. Derive the version rather than accepting one, so a dispatch can
            # never overwrite a shipped release. Separators must stay '-' and '.': '+' is
            # valid in semver but invalid in an OCI tag.
            base="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml || true)"
            base="${base%-SNAPSHOT}"
            case "$base" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "::error::could not derive a base version from pom.xml (got '$base')"
                exit 1
                ;;
            esac
            version="${base}-dev.${RUN_NUMBER}"
            is_release=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is-release=$is_release" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version (release: $is_release)"

  # --- OPTIONAL test gate (disabled: the EC2 self-hosted fleet is currently red) ----------------
  # Once the fleet is green (Phase 2), uncomment this job and add `test` to the `needs:` of the
  # `container` and `artifacts` jobs below. That makes the publish wait on the suite and publish
  # only when it is green. Until then, tests gate at PR time and this tag build publishes from an
  # already-tested commit.
  #
  # test:
  #   needs: version
  #   uses: ./.github/workflows/build-test-main.yml
  #   secrets: inherit

  container:
    needs: [version, artifacts]   # once the test gate is on: add `test`
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            app_version: ${{ needs.version.outputs.version }}
            versions_override: ""                                   # default tags: X, major, latest
            build_name: aerospike-graph-service
            dockerfile: docker/Dockerfile
            build_args: >-
              {"FIREFLY_GRAPH": "artifacts/unsigned-artifacts/aerospike-graph-gremlin-${{ needs.version.outputs.version }}.jar",
               "BULKLOADER": "artifacts/unsigned-artifacts/aerospike-graph-bulk-loader-${{ needs.version.outputs.version }}.jar"}
          - variant: slim
            app_version: ${{ needs.version.outputs.version }}-slim
            versions_override: "${{ needs.version.outputs.version }}-slim,slim,latest-slim"
            build_name: aerospike-graph-service-slim               # distinct build-info name
            dockerfile: docker/Dockerfile-slim
            # Dockerfile-slim declares only FIREFLY_GRAPH; an unconsumed build-arg still
            # lands in mode=max provenance.
            build_args: >-
              {"FIREFLY_GRAPH": "artifacts/unsigned-artifacts/aerospike-graph-gremlin-${{ needs.version.outputs.version }}.jar"}
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
    with:
      jf-project: connect
      image-name: aerospike-graph-service                          # one repo for both variants
      app-version: ${{ matrix.app_version }}
      versions-override: ${{ matrix.versions_override }}
      file: ${{ matrix.dockerfile }}
      jf-build-name: ${{ matrix.build_name }}
      gh-context-artifacts-json: |
        [{"name": "${{ needs.artifacts.outputs.gh-artifact-name }}", "dest": "artifacts"}]
      build-args-json: ${{ matrix.build_args }}
    secrets:
      build-secrets-json: '{"gpg_public_key": ${{ toJSON(secrets.GPG_PUBLIC_KEY) }}}'

  artifacts:
    needs: version   # once the test gate is on: needs: [version, test]
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
    with:
      gh-workflows-ref: 57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
      jf-project: connect
      jf-build-name: aerospike-graph-service-artifacts
      version: ${{ needs.version.outputs.version }}
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      gh-artifact-directory: dist
      setup-java: true
      java-version: "17"
      setup-helm: true
      jar-group-id: com.aerospike
      # Emits the graph uber jar, the bulk-loader uber jar and the packaged graphservice chart.
      build-script: ./scripts/build-ags-artifacts.sh ${{ needs.version.outputs.version }}
    # Map these explicitly. artifacts-cicd declares gpg-private-key/gpg-public-key/gpg-key-pass as
    # required, and `secrets: inherit` matches by name: our secrets are UPPER_SNAKE and a secret
    # name cannot contain a hyphen, so inherit leaves all three empty and the call never starts.
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  # Pull each published image and round-trip a Gremlin write and read against it. A TCP liveness
  # check is not sufficient: a process can hold 8182 open without the application classes loaded.
  #
  # Container exit code is not a valid oracle. docker-runtime-scripts/firefly-server.sh returns 0
  # after the JVM dies.
  #
  # No ci-guard: this workflow triggers only on tag push and workflow_dispatch, so a fork cannot
  # reach it.
  smoke-test:
    name: Smoke test ${{ matrix.variant }} (${{ matrix.platform }})
    needs: [version, container]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            tag: ${{ needs.version.outputs.version }}
            platform: linux/amd64
            runner: ubuntu-24.04
            expect_arch: X64
          - variant: slim
            tag: ${{ needs.version.outputs.version }}-slim
            platform: linux/amd64
            runner: ubuntu-24.04
            expect_arch: X64
          # Native on both sides: ubuntu-24.04-arm runners, and the Aerospike fixture image
          # publishes a linux/arm64 manifest.
          - variant: full
            tag: ${{ needs.version.outputs.version }}
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            expect_arch: ARM64
          - variant: slim
            tag: ${{ needs.version.outputs.version }}-slim
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            expect_arch: ARM64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # An amd64 host running `--platform linux/arm64` falls back to QEMU once binfmt is
      # registered, which would pass while testing something other than what ships.
      - name: Assert native runner
        env:
          EXPECT_ARCH: ${{ matrix.expect_arch }}
          RUNNER_ARCH_ACTUAL: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH_ACTUAL" != "$EXPECT_ARCH" ]; then
            echo "::error::${{ matrix.platform }} leg is on $RUNNER_ARCH_ACTUAL, expected $EXPECT_ARCH"
            exit 1
          fi
          echo "runner arch $RUNNER_ARCH_ACTUAL, native for ${{ matrix.platform }}"

      # Checked live rather than assumed, so a dropped platform manifest fails the leg instead
      # of silently falling back to emulation.
      - name: Assert the Aerospike fixture publishes this platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Keep in step with .github/aerospike/start_cluster.py's --aerospike_version default.
          fixture="aerospike/aerospike-server-enterprise:8.1"
          if ! docker manifest inspect "$fixture" \
               | jq -e --arg p "$PLATFORM" \
                   '[.manifests[]? | select("\(.platform.os)/\(.platform.architecture)" == $p)] | length > 0' \
               >/dev/null; then
            echo "::error::$fixture publishes no $PLATFORM manifest, so this leg cannot run native"
            exit 1
          fi
          echo "$fixture publishes $PLATFORM"

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: connect
        with:
          version: 2.78.8
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Docker login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Pull the published image
        id: pull
        env:
          IMAGE: artifact.aerospike.io/connect-docker-dev-local/aerospike-graph-service:${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Start Aerospike and the published Graph Service image
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          IMAGE: ${{ steps.pull.outputs.image }}
        run: |
          set -euo pipefail
          pip3 install python_on_whales
          bash scripts/start_aerospike.sh --node_count 1

          # start_cluster.py health-checks once and returns 0 even when the cluster never
          # answered, so confirm it here before anything depends on it.
          for i in $(seq 1 60); do
            if docker exec "$(docker ps -q --filter ancestor=aerospike/aerospike-server-enterprise:8.1 | head -1)" \
                 asinfo -v namespaces >/dev/null 2>&1; then
              echo "Aerospike answering after ${i}s"; break
            fi
            if [ "$i" -eq 60 ]; then
              echo "::error::Aerospike never answered; smoke test cannot run"
              docker ps -a --filter ancestor=aerospike/aerospike-server-enterprise:8.1 --format '{{.Names}} {{.Status}}'
              docker logs "$(docker ps -aq --filter ancestor=aerospike/aerospike-server-enterprise:8.1 | head -1)" 2>&1 | tail -30
              exit 1
            fi
            sleep 1
          done

          docker run -d --name ags-smoke -p 8182:8182 \
            --platform "${{ matrix.platform }}" \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            "$IMAGE"

      - name: Round-trip a Gremlin write and read
        run: |
          set -euo pipefail
          # Do not unpin: a newer client compiles iterate() into a discard() step this server lacks.
          tinkerpop="$(grep -m1 -oP '(?<=<tinkerpop.version>)[^<]+' pom.xml)"
          pip3 install "gremlinpython==${tinkerpop}"
          python3 scripts/smoke_gremlin_roundtrip.py ws://localhost:8182/gremlin 240

      - name: Graph Service logs on failure
        if: failure()
        run: docker logs ags-smoke || true

  # Tag runs only. A manual dispatch publishes artifacts but deliberately creates no bundle:
  # bundles are the promotion vehicle, and a promoted one locks its underlying dev-local
  # artifacts, which would then block re-deploying the same paths.
  #
  # smoke-test is in `needs` so a failed image cannot be bundled. A bundle around a broken image
  # is unrecoverable once PROD promotion mirrors it to Docker Hub.
  release-bundle:
    needs: [version, container, artifacts, smoke-test]
    if: needs.version.outputs.is-release == 'true'
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
    with:
      gh-workflows-ref: 57b6b0dae64ad344c2cf0d692018be1254569de3 # unreleased, shared-workflows#290
      jf-project: connect
      jf-bundle-name: aerospike-graph-service
      version: ${{ needs.version.outputs.version }}
      # Three build-info names, two numbering schemes: the docker workflow uses run_number,
      # the artifacts pipeline uses run_id-run_attempt.
      jf-build-names: "aerospike-graph-service:${{ github.run_number }},aerospike-graph-service-slim:${{ github.run_number }},aerospike-graph-service-artifacts:${{ github.run_id }}-${{ github.run_attempt }}"
    secrets: inherit
