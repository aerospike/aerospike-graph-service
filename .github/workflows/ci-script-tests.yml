name: Script Tests

# Unit tests for the release shell scripts under scripts/. These decide what a
# release publishes, so they run on every PR that touches them rather than
# behind the ci-guard label gate: they need no secrets and no cluster.

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/ci-script-tests.yml'
  push:
    branches:
      - 3.x-dev
      - opensource-ready
    paths:
      - 'scripts/**'
      - '.github/workflows/ci-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: Bats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The helper libraries are off because no suite here uses them.
      - name: Install bats
        uses: bats-core/bats-action@5b1e60c2ee94cb1b44a616ea4b1f466f9d6e38ef # 4.0.0
        with:
          bats-version: 1.12.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run Script Tests
        run: bats scripts/
