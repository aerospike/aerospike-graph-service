name: Graph Service Examples Tests

# Runs the graph-service-examples test suites (basic/TLS examples and load
# balancers). Only triggers when files relevant to the examples change, so
# unrelated PRs skip this workflow entirely (no runner time consumed).
on:
  pull_request:
    branches: [3.x-dev]
    paths:
      - 'graph-service-examples/**'
      - '.github/workflows/graph-service-examples-test.yml'
  workflow_dispatch:

concurrency:
  group: graph-service-examples-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-guard:
    # Fork-safe / label-gated gate. The test jobs depend on this via
    # `needs: ci-guard`, so on fork PRs that lack the `trusted-ci` label
    # this job fails fast and the test jobs are skipped.
    name: CI guard (fork + label check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT) — ci-guard allows."
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Same-repo PR ($HEAD_REPO) — ci-guard allows."
            exit 0
          fi
          if grep -q '"trusted-ci"' <<<"$LABELS"; then
            echo "Fork PR carries 'trusted-ci' label — ci-guard allows."
            exit 0
          fi
          echo "::error::Fork PRs must carry the 'trusted-ci' label before"
          echo "::error::CI with secrets will run. A maintainer will add the"
          echo "::error::label after reviewing the diff. See CONTRIBUTING.md."
          exit 1

  test-basic-and-tls-examples:
    name: Basic Example and TLS Tests
    needs: ci-guard
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graph-service-examples
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Set up Aerospike Server and Graph
        run: |
          sudo apt-get update
          docker compose up -d

      - name: Setup Node.js 22.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'

      - name: Upgrading Pip
        working-directory: graph-service-examples/python
        run: |
          python -m pip install --upgrade pip

      - name: Wait for AGS
        run: docker compose up -d --wait

      - name: Run pytest against python transactions ui example
        working-directory: graph-service-examples/python/transactions
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --maxfail=1

      - name: Run pytest against python food_delivery_app
        working-directory: graph-service-examples/python/food_delivery_app
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --maxfail=1

      - name: Install dependencies node-js
        working-directory: graph-service-examples/nodejs/basic
        run: npm ci

      - name: Run Mocha tests
        working-directory: graph-service-examples/nodejs/basic
        run: npm test

      - name: Run Playwright E2E tests
        working-directory: graph-service-examples/nodejs/basic
        run: |
          npx playwright install --with-deps
          npm run test:e2e

      - name: Set Up Java
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Test Java Example
        working-directory: graph-service-examples/java/basic
        run: |
          mvn test

      - name: Close Docker Containers
        run: |
          docker compose down

      - name: Install TLS test dependencies
        working-directory: graph-service-examples/python/tls
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install OpenSSL (required for certificate generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Run AGS-to-AerospikeDB Certificate Tests
        working-directory: graph-service-examples/python/tls/tests
        run: |
          pytest test_AGS_DB_certificates.py -v

      - name: Run AGS-to-AerospikeDB Connection Tests
        working-directory: graph-service-examples/python/tls/tests
        run: |
          pytest test_AGS_DB_connection.py -v --maxfail=1
        timeout-minutes: 2

      - name: Run GremlinClient-to-AGS Certificate Tests
        working-directory: graph-service-examples/python/tls/tests
        run: |
          pytest test_Gremlin_AGS_certificates.py -v

      - name: Run GremlinClient-to-AGS Connection Tests
        working-directory: graph-service-examples/python/tls/tests
        run: |
          pytest test_Gremlin_AGS_connection.py -v --maxfail=1
        timeout-minutes: 2

  test-load-balancers:
    name: Load Balancers
    needs: ci-guard
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [python, golang, nodejs]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Install Docker compose + nc
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Setup runtimes (per target)
        if: matrix.target == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.9' }

      - name: Setup Node
        if: matrix.target == 'nodejs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }

      - name: Setup Go
        if: matrix.target == 'golang'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.22.x'
          check-latest: true
          cache: true
          cache-dependency-path: graph-service-examples/golang/load-balancer/go.sum

      - name: docker compose up
        working-directory: ${{ matrix.target == 'python' && 'graph-service-examples/python/load_balancer' || matrix.target == 'nodejs' && 'graph-service-examples/nodejs/load-balancer' || 'graph-service-examples/golang/load-balancer' }}
        run: docker compose -f ../../common/docker-compose-load-balancer.yaml up -d --wait

      - name: Python LB tests
        if: matrix.target == 'python'
        working-directory: graph-service-examples/python/load_balancer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest tests/ -v --maxfail=1

      - name: Node LB tests
        if: matrix.target == 'nodejs'
        working-directory: graph-service-examples/nodejs/load-balancer
        run: |
          npm ci
          npm test

      - name: Go LB tests
        if: matrix.target == 'golang'
        working-directory: graph-service-examples/golang/load-balancer
        run: |
          go mod tidy
          go build ./...
          go test -v ./tests/

      - name: docker compose down
        if: always()
        working-directory: ${{ matrix.target == 'python' && 'graph-service-examples/python/load_balancer' || matrix.target == 'nodejs' && 'graph-service-examples/nodejs/load-balancer' || 'graph-service-examples/golang/load-balancer' }}
        run: docker compose -f ../../common/docker-compose-load-balancer.yaml down -v
