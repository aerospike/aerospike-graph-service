name: Weekly Build

on:
  schedule:
    # 8:00 AM UTC every Monday
    - cron: '0 8 * * 1'

jobs:
  trigger-weekly-build:
    name: Trigger weekly build
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set date
        run: echo "WEEKLY=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
      - name: Create Snyk pull requests
        if: always()
        run: |
          gh pr create -B 3.x-snyk -H 3.x-dev --title 'Weekly ${{ env.WEEKLY }}: Snyk vulnerability check 3.x-dev' --body 'Created by Github action'
        env:
          GITHUB_TOKEN: ${{ secrets.SNYK_WEEKLY_PAT }}
