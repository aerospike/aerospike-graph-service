name: CodeQL (Java)

# GitHub CodeQL static analysis for Java sources. Runs on every pull
# request, on push to the canonical branches, and on a weekly schedule
# so that new CodeQL rules still hit this repo even when nothing lands.
#
# Alerts land in the "Security" tab of the repo. False positives can be
# dismissed there; genuine findings should be triaged as issues.

on:
  pull_request:
    branches:
      - main
      - opensource-ready
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/codeql.yml'
  push:
    branches:
      - main
      - opensource-ready
    paths:
      - '**/*.java'
      - '**/pom.xml'
      - '.github/workflows/codeql.yml'
  schedule:
    # Mondays at 11:42 UTC — offset from other scheduled scans to avoid
    # saturating the runner pool.
    - cron: '42 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # required for github/codeql-action to upload SARIF to the Security tab
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.9
        with:
          languages: java
          # security-and-quality is a superset of security-extended; ship
          # with it enabled so new quality-style findings are surfaced
          # early. We can downshift to security-extended if the signal
          # ratio is bad.
          queries: security-and-quality

      - name: Build (Maven, tests skipped)
        run: mvn -ntp -DskipTests -Dspotbugs.skip=true -Denforcer.skip=true -Dlicense.skip=true package

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.9
        with:
          category: "/language:java"
