  benchmark:
    name: benchmark-firefly
    timeout-minutes: 120
    #needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: reugn/github-action-aerospike@v1
        with:
          server-version: 6.0.0.1
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly in Gremlin-Server
        run: |
          echo "Starting"
          pwd
          ls -l
          wget -O gremlin-server https://dlcdn.apache.org/tinkerpop/3.6.0/apache-tinkerpop-gremlin-server-3.6.0-bin.zip
          echo "gremlin-server downloaded"
          ls -l
          unzip gremlin-server
          echo "gremlin-server unzipped"
          ls -l
          echo "Build Firefly"
          mvn clean install -DskipTests
          ls -l
          echo "Installing Firefly in gremlin-server"
          ./apache-tinkerpop-gremlin-server-3.6.0/bin/gremlin-server.sh install 'com.aerospike firefly-gremlin 0.1.0-SNAPSHOT'
          
          echo "Starting gremlin-server"
          /home/ubuntu/apache-tinkerpop-gremlin-server-3.6.0/bin/gremlin-server.sh /home/ubuntu/firefly/conf/firefly-gremlin-server.yaml
      # - name: Benchmark Firefly
