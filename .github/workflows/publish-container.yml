name: Publish RC

# Publish the container if a tag of 'vX.Y.Z-rcW' is made.
# Example: v0.0.1-rc1, v0.1.0-rc2, v1.0.0-rc3, etc.
# THIS WILL NOT RUN ON TAGS WITHOUT A DASH IN THEM (release candidates only)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

env:
  GITHUB_REPOSITORY_NAME: citrusleaf
  GITHUB_IMAGE_NAME: firefly
  GITHUB_REGISTRY_URL: ghcr.io

jobs:

  publish-artifacts:
    name: Publish Artifacts - RC
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Java 17 Install
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5

      - name: Build Firefly and Bulk Loader
        run: |
          mvn clean install -DskipTests
          if find aerospike-graph-gremlin/target -type f -name "-SNAPSHOT.jar" | grep -q .; then
            echo "ERROR: output file ended with '-SNAPSHOT' in aerospike-graph-gremlin/target, please update version before publishing a release candidate"
            exit 1
          fi
          if find aerospike-graph-bulk-loader/target -type f -name "-SNAPSHOT.jar" | grep -q .; then
              echo "ERROR: output file ended with '-SNAPSHOT' in aerospike-graph-bulk-loader/target, please update version before publishing a release candidate"
              exit 1
          fi

      - name: Upload Jar Files
        uses: actions/upload-artifact@v4
        with:
            path: aerospike-graph-*/target/aerospike-graph-*.jar

  publish-github-amd:
    name: Publish Firefly Docker Image - AMD - GitHub - RC
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: publish-artifacts
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.CONTAINER_PUBLISH_PASSWORD }} | docker login $GITHUB_REGISTRY_URL --username ${{ secrets.CONTAINER_PUBLISH_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Download Jar Files
        uses: actions/download-artifact@v4

      - name: Publish Container
        run: |
          # Install python_on_whales.
          pip3 install python_on_whales
          
          # Make output directories.
          mkdir aerospike-graph-gremlin/target
          mkdir aerospike-graph-bulk-loader/target
          
          # Move the jar files to the target bin folders.
          mv artifact/aerospike-graph-gremlin/target/aerospike-graph-gremlin-*.jar aerospike-graph-gremlin/target/
          mv artifact/aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar aerospike-graph-bulk-loader/target/
          
          # Strip git ref prefix (refs/tags or ref/heads).
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          
          # Strip prefixed v if it is a tag.
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          UNSTABLE_INDICATOR="-"
          DOCKER_IMAGE=$(if [[ $( echo $VERSION | grep -c -i $UNSTABLE_INDICATOR ) -eq 0 ]]; \
                        then echo $GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:latest; \
                        else echo $GITHUB_REGISTRY_URL/$GITHUB_REPOSITORY_NAME/$GITHUB_IMAGE_NAME:unstable; fi)
          DOCKER_IMAGE=$(echo $DOCKER_IMAGE | tr '[A-Z]' '[a-z]')
          
          echo "Building and tagging docker image for linux/amd64 and linux/arm64 $DOCKER_IMAGE $OUTPUT_IMAGE"
          python3 scripts/build-docker.py --tags ${DOCKER_IMAGE}-amd64 ${OUTPUT_IMAGE}-amd64 --platforms linux/amd64 --push --use_local

