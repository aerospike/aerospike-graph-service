  negative-test-bulk-loader-call-docker:
    name: Bulk Loader Call without Spark Fails
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build Docker Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          pip3 install python_on_whales
          bash -x scripts/start_aerospike.sh
          python3 ./scripts/build-docker.py --tags aerospike/firefly --slim
          
          docker run -d -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/:/opt/aerospike-graph/custom/ \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-graph/etc/ \
            aerospike/firefly
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemoteFailsWithoutSpark --no-transfer-progress
  test-firefly-chainable-maven:
    name: Test Chainable Maven
    timeout-minutes: 120
    needs: start-chainable-maven-runner
    runs-on: ${{ needs.start-chainable-maven-runner.outputs.label }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build maven
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh --node_count 1
          mvn install -DskipTests
      - name: Test Summary Updater TTL Exclusion
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyGraphSummaryUpdaterTest --no-transfer-progress
      - name: Test Client Event Loop Configuration
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=TestAerospikeClientConfigEventLoop --no-transfer-progress
      - name: Test Small Memory Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyExceedHeap -Dintegration.test.properties=packed -Djvmheapsize=small --no-transfer-progress
      - name: Test Stack Overflow Maven
        run: |
          sudo echo "172.17.0.1 aerospike.test.aerospike.dev" > /etc/hosts
          mvn test -pl aerospike-graph-gremlin -Dtest=TestSupernodeStackOverflow --no-transfer-progress
