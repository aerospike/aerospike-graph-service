name: Auto-merge

# Queue a pull request for automatic merge once branch protection
# requirements are satisfied. Maintainers opt in by adding the
# `automerge` label after review.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge
    if: |
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      (
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'automerge')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Verify maintainer added automerge label
        if: github.event.action == 'labeled' && github.event.label.name == 'automerge'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write)
              echo "Maintainer ${ACTOR} (${perm}) enabled auto-merge."
              ;;
            *)
              echo "::error::Only maintainers can add the 'automerge' label."
              exit 1
              ;;
          esac

      - name: Enable pull request auto-merge
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: rebase
