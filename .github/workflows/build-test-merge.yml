    runs-on: ${{ needs.start-runner-benchmark-identifies.outputs.label }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh

          echo "Build Firefly"
          mvn clean install -DskipTests --no-transfer-progress

          echo "Starting firefly-server"
          graph_jar=$(echo aerospike-graph-gremlin/target/aerospike-graph-gremlin-*.jar)
          bulk_loader_jar=$(echo aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar)
          java -cp "$graph_jar:$bulk_loader_jar" com.aerospike.firefly.runtime.FireflyServer /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &
          
          echo "Sleeping for 30 seconds while firefly-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestIdentifiesTraversal -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Identifies Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  test-chainable-docker:
    name: Test Chainable Docker
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Build docker
        run: |
          pip3 install python_on_whales
          echo "Building docker image"
          python3 scripts/build-docker.py --tags firefly --platforms linux/amd64
          python3 scripts/build-docker.py --tags firefly-slim --platforms linux/amd64 --use_local --slim
      # Due to the nature of the multi usage stats test, it MUST come first. Otherwise it will have problems.
      - name: Run multi Firefly usage test
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh

          echo "Running docker image with custom yaml file"
          docker run -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs-usage-stats/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30
          
          echo "Running usage test"
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyUsageStatsCallMultiTest -DfailIfNoTests=false --no-transfer-progress
          
          echo "Stopping docker image"
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image Secret Masking
        # This test does not need to stop the image because SSL is not configured properly, so it errors and exits but the test serves its purpose regardless.
        run: |
          echo "Running docker image with secrets"
          docker run --name firefly -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-secret-masking/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties -e JAVA_OPTIONS="-Djavax.net.ssl.trustStore=/root/aerospike/truststore.jks -Djavax.net.ssl.keyStore=/root/aerospike/keystore.jks -Djavax.net.ssl.trustStorePassword=simon123 -Djavax.net.ssl.keyStorePassword=simon123" firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Showing docker image logging..."
          docker logs firefly
          echo "Running secret masking test script"
          bash scripts/test-secret-masking.sh
      - name: Launch Firefly Docker Image with Custom yaml
        run: |
          echo "Running docker image with custom yaml file"
          docker run -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs:/opt/aerospike-graph/custom firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30
          
          echo "Running connection test"
          mvn test -pl aerospike-graph-gremlin -Dtest=ValidConnectionTest -DfailIfNoTests=false --no-transfer-progress
          
          echo "Stopping docker image"
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Launch Firefly Docker Image with Custom properties
        run: |
          echo "Running docker image with custom properties file"
          docker run -p 8182:8182 -v /home/runner/work/firefly/firefly/conf/test-custom-configs/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly &

          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=ValidConnectionTest -DfailIfNoTests=false --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image with Security Enabled
        run: |
          echo "Running docker image with security enabled"
          docker run -p 8182:8182 -p 9090:9090 -v /home/runner/work/firefly/firefly/conf/test-security/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties -e aerospike.graph.audit.log.enabled=true firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running Security Test"
          mvn test -pl aerospike-graph-gremlin -Dtest=JwtAuthenticationDockerTest -DfailIfNoTests=false --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image with Default Prometheus
        run: |
          echo "Running docker image with prometheus"
          docker run -p 8182:8182 -p 9090:9090 -v /home/runner/work/firefly/firefly/conf/test-custom-configs/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties firefly &
          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running Prometheus Test"
          mvn test -pl aerospike-graph-gremlin -Dtest=PrometheusExporterTest -DfailIfNoTests=false --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image Bulk Loader Call
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
        run: |
          
          docker run -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/docker-bulk-load/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            -v /home/runner/work/firefly/firefly/data/docker-bulk-load/:/opt/aerospike-graph/etc/ \
            firefly &
          
          echo "Sleeping for 30 seconds while docker image starts"
          sleep 30
          
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemote -DfailIfNoTests=false --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image Merge Edge Step
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ secrets.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
        run: |
          docker run -p 8182:8182  \
            -v /home/runner/work/firefly/firefly/conf/aerospike-graph.properties:/opt/aerospike-graph/aerospike-graph.properties \
            firefly &
          
          echo "Sleeping for 30 seconds while docker image starts"
          sleep 30
          
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyMergeEdgeStepRemoteTest -DfailIfNoTests=false --no-transfer-progress
          docker stop $(docker ps -q --filter ancestor=firefly)
          echo "Sleeping 10 seconds for docker to kill the container"
      - name: Test Firefly Docker Image
        run: |
          echo "Running performance mode tests"
          mvn test -pl aerospike-graph-gremlin -Dtest=TestPerformanceModes -DfailIfNoTests=false --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerJavaOptions -DfailIfNoTests=false --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerConfigs -DfailIfNoTests=false --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestSlimVsFat -DfailIfNoTests=false --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestDockerShutdown -DfailIfNoTests=false --no-transfer-progress
