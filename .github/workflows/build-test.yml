      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-09d4741104f30e958
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  start-runner-spark-bulk-loader:
    name: Start Spark Bulk Loader Runner
    runs-on: ubuntu-latest
    needs: build-firefly-maven
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start EC2 runner
        id: start-ec2-runner
        uses: machulav/ec2-github-runner@v2
        with:
          mode: start
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          ec2-image-id: ami-09d4741104f30e958
          ec2-instance-type: t2.2xlarge
          subnet-id: subnet-0bdbb4255fbffb239
          security-group-id: sg-005fce4b475465f9e
  build-firefly-docker:
    name: Build Firefly Docker
    timeout-minutes: 120
    needs: start-runner-docker
    runs-on: ${{ needs.start-runner-docker.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          java -XX:+PrintFlagsFinal -version | grep HeapSize
          docker build -t aerospike/firefly .
  test-firefly-linked:
    name: Test Linked
    timeout-minutes: 120
    needs: start-runner-linked
    runs-on: ${{ needs.start-runner-linked.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v3
        with:
          server-version: 6.1.0.3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          mvn -pl firefly-gremlin -Dintegration.test.properties=linked test --no-transfer-progress
  test-firefly-movielens-linked:
    name: Test Movielens Linked
    timeout-minutes: 120
    needs: start-runner-movielens-linked
    runs-on: ${{ needs.start-runner-movielens-linked.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v3
        with:
          server-version: 6.1.0.3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Test with Maven
        run: |
          mvn test -pl firefly-gremlin -Dtest=TestMovielens1M -DfailIfNoTests=false -Dintegration.test.properties=linked --no-transfer-progress
  test-firefly-packed:
    name: Test Packed
    timeout-minutes: 120
    needs: start-runner-packed
    runs-on: ${{ needs.start-runner-packed.outputs.label }}
