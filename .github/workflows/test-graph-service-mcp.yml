name: Test Graph Service MCP Integration

# Runs the graph-service-mcp Python test suite. Only triggers when files
# relevant to the MCP server change, so unrelated PRs skip this workflow
# entirely (no runner time consumed).
on:
  pull_request:
    branches: [3.x-dev]
    paths:
      - 'graph-service-mcp/**'
      - '.github/workflows/test-graph-service-mcp.yml'
  workflow_dispatch:

concurrency:
  group: graph-service-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-guard:
    # Fork-safe / label-gated gate. The test job depends on this via
    # `needs: ci-guard`, so on fork PRs that lack the `trusted-ci` label
    # this job fails fast and the test job is skipped, keeping the
    # AEROSPIKE_DEV_LICENSE secret out of reach.
    name: CI Guard (Fork + Label Check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Enforce Fork and Label Policy
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT) — ci-guard allows."
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Same-repo PR ($HEAD_REPO) — ci-guard allows."
            exit 0
          fi
          if grep -q '"trusted-ci"' <<<"$LABELS"; then
            echo "Fork PR carries 'trusted-ci' label — ci-guard allows."
            exit 0
          fi
          echo "::error::Fork PRs must carry the 'trusted-ci' label before"
          echo "::error::CI with secrets will run. A maintainer will add the"
          echo "::error::label after reviewing the diff. See CONTRIBUTING.md."
          exit 1

  test-graph-service-mcp:
    name: Test Graph Service MCP
    needs: ci-guard
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Set Up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      # 3.10 is the package's minimum supported version; used for both the
      # AGS image build tooling (python_on_whales) and the MCP test suite.
      - name: Set Up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Set Up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Up Maven
        uses: step-security/setup-maven@952ce6ada26435ad361053035d888477856de677 # v5.0.1
        with:
          maven-version: 3.9.5

      - name: Build AGS Image and Start Aerospike + Graph Service
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          set -euo pipefail
          # Start the Aerospike database cluster.
          pip3 install python_on_whales
          bash -x scripts/start_aerospike.sh --node_count 1

          # Build the Aerospike Graph Service image from the current source.
          python3 ./scripts/build-docker.py --tags aerospike/firefly --slim

          # Start Graph Service, pointing it at the Aerospike DB on the host.
          docker run -d -p 8182:8182 \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            aerospike/firefly

          # Wait until the Gremlin server is accepting connections on 8182.
          bash scripts/wait_for_gremlin_server.sh

      - name: Install MCP Server and Test Dependencies
        working-directory: graph-service-mcp
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run MCP Tests
        working-directory: graph-service-mcp
        env:
          GREMLIN_URL: ws://localhost:8182/gremlin
          GREMLIN_ALIAS: g
        run: |
          pytest tests/ -v
