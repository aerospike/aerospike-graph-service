name: Publish Dev (QE)

# Automatic publishing is disabled until QE registry access is restored on
# GitHub-hosted runners. Re-enable the push triggers below when ready.
on:
  workflow_dispatch:
# on:
#   push:
#     tags:
#       - 'v[0-9]+.[0-9]+.[0-9]+-qe-**'
#     branches: [3.x-dev]

env:
  QE_DOCKER_REGISTRY: secure.docker.qe.aerospike.com
  QE_DOCKER_USERNAME: ${{ vars.QE_DOCKER_USERNAME }}

jobs:
  publish-github-amd:
    name: Publish Firefly Docker Image - AMD - QE
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Login to GitHub Container Registry
        run: |
          # Login to ghcr.io.
          echo ${{ secrets.QE_REGISTRY_PASSWORD }} | docker login $QE_DOCKER_REGISTRY --username $QE_DOCKER_USERNAME --password-stdin

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - name: Publish Container
        run: |
          # Install python_on_whales.
          pip3 install python_on_whales
          
          # Strip git ref prefix (refs/tags or ref/heads).
          VERSION=$(git rev-parse --short "$GITHUB_SHA")
          
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$QE_DOCKER_REGISTRY/firefly:dev-$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          
          DOCKER_IMAGE=$QE_DOCKER_REGISTRY/firefly:dev
          DOCKER_IMAGE=$(echo $DOCKER_IMAGE | tr '[A-Z]' '[a-z]')
          
          echo "Building and tagging docker image for linux/amd64 and linux/arm64 $DOCKER_IMAGE $OUTPUT_IMAGE"
          python3 scripts/build-docker.py --tags ${DOCKER_IMAGE}-amd64 ${OUTPUT_IMAGE}-amd64 --platforms linux/amd64 --push

  publish-github-arm:
