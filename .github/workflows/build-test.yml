  benchmark-internal dataset-flow-firefly:
    name: Benchmark internal dataset Flow Firefly
    timeout-minutes: 240
    needs: start-runner-benchmark-internal dataset
    runs-on: ${{ needs.start-runner-benchmark-internal dataset.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh
          echo "Downloading gremlin-server"
          cd ..
          wget -O gremlin-server https://archive.apache.org/dist/tinkerpop/3.7.1/apache-tinkerpop-gremlin-server-3.7.1-bin.zip --quiet
          echo "Unzipping gremlin-server"
          unzip -qq gremlin-server

          echo "Build Firefly"
          cd firefly
          mvn clean install -DskipTests --no-transfer-progress

          echo "Installing Firefly in gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.7.1/bin/gremlin-server.sh install 'com.aerospike aerospike-graph-gremlin 2.0.0-SNAPSHOT'

          echo "Starting gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.7.1/bin/gremlin-server.sh /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &

          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestSyntheticinternaldataset -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark internal dataset Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
