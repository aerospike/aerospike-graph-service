          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  benchmark-identifies-flow-firefly:
    name: Benchmark Identifies Flow Firefly
    timeout-minutes: 240
    needs: start-runner-benchmark-identifies
    runs-on: ${{ needs.start-runner-benchmark-identifies.outputs.label }}
    steps:
      - uses: actions/checkout@v3
      - uses: cinterloper/github-action-aerospike@v5
        with:
          server-version: ee-6.2.0.7
          feature-key-b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          firefly-path: /actions-runner/_work/firefly/firefly
          config-file: '.github/aerospike/aerospike.conf'
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Launch Firefly in Gremlin-Server and Run Benchmark
        run: |
          echo "Downloading gremlin-server"
          cd ..
          wget -O gremlin-server https://archive.apache.org/dist/tinkerpop/3.6.3/apache-tinkerpop-gremlin-server-3.6.3-bin.zip --quiet
          echo "Unzipping gremlin-server"
          unzip -qq gremlin-server

          echo "Build Firefly"
          cd firefly
          mvn clean install -DskipTests --no-transfer-progress

          echo "Installing Firefly in gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.3/bin/gremlin-server.sh install 'com.aerospike aerospike-graph-gremlin 1.1.0-SNAPSHOT'

          echo "Starting gremlin-server"
          ../apache-tinkerpop-gremlin-server-3.6.3/bin/gremlin-server.sh /actions-runner/_work/firefly/firefly/conf/firefly-gremlin-server-github-actions.yaml &

          echo "Sleeping for 30 seconds while gremlin-server starts"
          sleep 30

          echo "Running benchmark"
          mvn test -pl aerospike-graph-gremlin -Dtest=BenchmarkTestIdentifiesTraversal -DfailIfNoTests=false --no-transfer-progress
      - name: Publish Benchmark Identifies Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: aerospike-graph-gremlin/target/jmh-result.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@lyndonbauto @cinterloper @DKZed'
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/
  run-prometheus-test:
