        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: |
          # Login to ghcr.io.
          echo ${{ secrets.QE_REGISTRY_PASSWORD }} | docker login $QE_DOCKER_REGISTRY --username $QE_DOCKER_USERNAME --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Download Jar Files
        uses: actions/download-artifact@v3

      - name: Publish Container
        run: |
          # Install python_on_whales.
          pip3 install python_on_whales
          
          # Strip git ref prefix (refs/tags or ref/heads).
          VERSION=$(git rev-parse --short "$GITHUB_SHA")
          
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$QE_DOCKER_REGISTRY/firefly:dev-$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          
          DOCKER_IMAGE=$QE_DOCKER_REGISTRY/firefly:dev
          DOCKER_IMAGE=$(echo $DOCKER_IMAGE | tr '[A-Z]' '[a-z]')
          
          echo "Building and tagging docker image for linux/amd64 and linux/arm64 $DOCKER_IMAGE $OUTPUT_IMAGE"
          python3 scripts/build-docker.py --tags ${DOCKER_IMAGE}-slim-arm64 ${OUTPUT_IMAGE}-slim-arm64 --platforms linux/arm64 --push --slim
  publish-github-amd-slim:
    name: Publish Firefly Docker Image - AMD - slim - QE
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: |
          # Login to ghcr.io.
          echo ${{ secrets.QE_REGISTRY_PASSWORD }} | docker login $QE_DOCKER_REGISTRY --username $QE_DOCKER_USERNAME --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Download Jar Files
        uses: actions/download-artifact@v3

      - name: Publish Container
        run: |
          # Install python_on_whales.
          pip3 install python_on_whales
          
          # Strip git ref prefix (refs/tags or ref/heads).
          VERSION=$(git rev-parse --short "$GITHUB_SHA")
          
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$QE_DOCKER_REGISTRY/firefly:dev-$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          
