name: Build and Test Firefly

on:
  pull_request:
    branches: [main,3.x-dev]

jobs:
  ci-guard:
    # Fork-safe / label-gated gate. Downstream jobs depend on this via
    # `needs: ci-guard`, so on fork PRs that lack the `trusted-ci`
    # label this job fails fast and the rest of the workflow is
    # skipped, keeping AWS/GCS/license secrets out of reach.
    name: CI guard (fork + label check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT) — ci-guard allows."
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Same-repo PR ($HEAD_REPO) — ci-guard allows."
            exit 0
          fi
          if grep -q '"trusted-ci"' <<<"$LABELS"; then
            echo "Fork PR carries 'trusted-ci' label — ci-guard allows."
            exit 0
          fi
          echo "::error::Fork PRs must carry the 'trusted-ci' label before"
          echo "::error::CI with secrets will run. A maintainer will add the"
          echo "::error::label after reviewing the diff. See CONTRIBUTING.md."
          exit 1

  olap-guard:
    # OLAP jobs are heavy (Spark, long runtime). They run only when a maintainer
    # adds the `olap-ci` label to the pull request.
    name: OLAP CI (requires olap-ci label)
    needs: ci-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - name: Gate
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if grep -q '"olap-ci"' <<<"$LABELS"; then
            echo "olap-ci label present — OLAP test jobs will run."
          else
            echo "No olap-ci label — OLAP test jobs are skipped."
            echo "Add the 'olap-ci' label to this PR to enable OLAP CI."
          fi

  build-firefly-maven:
    needs: ci-guard
    name: Build Firefly Maven
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build Maven Project
        run: |
          mvn clean package -DskipTests --no-transfer-progress
  negative-test-bulk-loader-call-docker:
    needs: ci-guard
    name: Bulk Loader Call without Spark Fails
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build Docker Image
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
          GCS_PRIVATE_KEY_ID: ${{ vars.GCS_PRIVATE_KEY_ID }}
          GCS_CLIENT_EMAIL: ${{ vars.GCS_CLIENT_EMAIL }}
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          pip3 install python_on_whales
          bash -x scripts/start_aerospike.sh
          python3 ./scripts/build-docker.py --tags aerospike/firefly --slim
          
          docker run -d -p 8182:8182  \
            --add-host=host.docker.internal:host-gateway \
            -e aerospike.client.host=host.docker.internal \
            -v ${{ github.workspace }}/conf/docker-bulk-load/:/opt/aerospike-graph/custom/ \
            -v ${{ github.workspace }}/data/docker-bulk-load/:/opt/aerospike-graph/etc/ \
            aerospike/firefly

          bash scripts/wait_for_gremlin_server.sh

          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyBulkLoaderCallEntrypointRemoteFailsWithoutSpark --no-transfer-progress
  test-firefly-chainable-maven:
    name: Test Chainable Maven
    timeout-minutes: 120
    needs: ci-guard
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Build maven
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike.sh --node_count 1
          mvn install -DskipTests
      - name: Test Summary Updater TTL Exclusion
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyGraphSummaryUpdaterTest --no-transfer-progress
      - name: Test Client Event Loop Configuration
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestAerospikeClientConfigEventLoop --no-transfer-progress
      - name: Test Small Memory Maven
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflyExceedHeap -Dintegration.test.properties=packed -Djvmheapsize=small --no-transfer-progress
      - name: Test Stack Overflow Maven
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestSupernodeStackOverflow --no-transfer-progress
      - name: Test Client Provider Maven
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=ConcurrentClientProviderInstantiationTest -Dtest=TestAerospikeClientProviderConfiguration --no-transfer-progress
      - name: Test Call Steps Maven
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestAdminCallHttp --no-transfer-progress
          mvn test -pl aerospike-graph-gremlin -Dtest=TestFireflySindexCallSteps --no-transfer-progress
      - name: Test Compression Flag Docker Network
        run: |
          bash scripts/map_aerospike_test_host.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=TestAerospikeNetwork --no-transfer-progress
  test-firefly:
