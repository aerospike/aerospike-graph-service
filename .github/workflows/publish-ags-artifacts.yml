# Publish Aerospike Graph Service artifacts to JFrog via the shared-workflows pipeline.
#
# Two triggers, one pipeline:
#
#   push (vX.Y.Z[-rcN])  A real release. The tagged commit was already tested at PR time, so
#                        this builds, signs, deploys, and bundles. It does not re-run the EC2
#                        test fleet (see the commented-out `test` gate below).
#
#   workflow_dispatch    A manual smoke run that publishes uniquely versioned development
#                        artifacts and skips release-bundle creation.
#
# Produces, all under the `connect` JFrog project:
#   - the multi-arch container (full + slim) -> connect-docker-dev-local
#   - the graph + bulk-loader uber JARs       -> connect-maven-dev-local
#   - the aerospike-graph Helm chart          -> connect-helm-dev-local
# then, on a tag only, assembles a release bundle (aerospike-graph-service) for DEV -> PROD
# promotion. On PROD promotion the existing artifact-publisher automation mirrors the image to
# Docker Hub.
name: Publish AGS Artifacts

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# Unlisted scopes become none, and a nested workflow cannot request more than the caller grants.
# This is the union the pinned call tree needs.
permissions:
  id-token: write       # OIDC to JFrog
  contents: read
  packages: write       # container push
  attestations: write   # SBOM + SLSA provenance

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      chart-version: ${{ steps.v.outputs.chart-version }}
      is-release: ${{ steps.v.outputs.is-release }}
      mode: ${{ steps.v.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # required, or extract-version falls back to 0.0.0-dev+<sha>
      - id: tag
        if: github.event_name == 'push'
        uses: aerospike/shared-workflows/.github/actions/extract-version-from-tag@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      - name: Resolve Release or Development Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          TAG_VERSION: ${{ steps.tag.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chart_base="$(grep -m1 -oP '^\s*version:\s*"?\K[^"\s]+' helm/aerospike-graph/Chart.yaml || true)"
          case "$chart_base" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::could not derive a chart version from helm/aerospike-graph/Chart.yaml (got '$chart_base')"
              exit 1
              ;;
          esac
          if [ "$EVENT" = "push" ]; then
            version="$TAG_VERSION"
            case "$version" in
              "" | 0.0.0-dev*)
                echo "::error::version did not resolve from the tag (got '$version'); need fetch-depth: 0 and a vX.Y.Z tag"
                exit 1
                ;;
            esac
            chart_version="$chart_base"
            is_release=true
          else
            # Manual run. Derive the version rather than accepting one, so a dispatch can
            # never overwrite a shipped release. Separators must stay '-' and '.': '+' is
            # valid in semver but invalid in an OCI tag.
            base="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml || true)"
            base="${base%-SNAPSHOT}"
            case "$base" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *)
                echo "::error::could not derive a base version from pom.xml (got '$base')"
                exit 1
                ;;
            esac
            version="${base}-dev.${RUN_NUMBER}"
            chart_version="${chart_base}-dev.${RUN_NUMBER}"
            is_release=false
          fi
          if [ "$EVENT" = "push" ]; then
            mode="release"
          else
            last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -n "$last_tag" ]; then
              mode="$(git diff --name-only "${last_tag}..HEAD" | ./scripts/classify-release-change.sh)"
            else
              mode="dev"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chart-version=$chart_version" >> "$GITHUB_OUTPUT"
          echo "is-release=$is_release" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved application version: $version; chart version: $chart_version (release: $is_release; mode: $mode)"

  # --- OPTIONAL test gate (disabled: the EC2 self-hosted fleet is currently red) ----------------
  # Once the fleet is green (Phase 2), uncomment this job and add `test` to the `needs:` of the
  # `container` and `artifacts` jobs below. That makes the publish wait on the suite and publish
  # only when it is green. Until then, tests gate at PR time and this tag build publishes from an
  # already-tested commit.
  #
  # test:
  #   needs: version
  #   uses: ./.github/workflows/test-extended.yml
  #   secrets: inherit

  container:
    name: Build and Push AGS Container Images
    needs: [version, jars-sign, jars-deploy, jars-fetch]
    if: always() && needs.version.result == 'success' && (needs.jars-sign.result == 'success' || needs.jars-fetch.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            app_version: ${{ needs.version.outputs.version }}
            versions_override: ""                                   # default tags: X, major, latest
            build_name: aerospike-graph-service
            dockerfile: docker/Dockerfile
            build_args: >-
              {"FIREFLY_GRAPH": "artifacts/unsigned-artifacts/aerospike-graph-gremlin-${{ needs.version.outputs.version }}.jar",
               "BULKLOADER": "artifacts/unsigned-artifacts/aerospike-graph-bulk-loader-${{ needs.version.outputs.version }}.jar"}
          - variant: slim
            app_version: ${{ needs.version.outputs.version }}-slim
            versions_override: "${{ needs.version.outputs.version }}-slim,slim,latest-slim"
            build_name: aerospike-graph-service-slim               # distinct build-info name
            dockerfile: docker/Dockerfile-slim
            # Dockerfile-slim declares only FIREFLY_GRAPH; an unconsumed build-arg still
            # lands in mode=max provenance.
            build_args: >-
              {"FIREFLY_GRAPH": "artifacts/unsigned-artifacts/aerospike-graph-gremlin-${{ needs.version.outputs.version }}.jar"}
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      jf-project: connect
      image-name: aerospike-graph-service                          # one repo for both variants
      app-version: ${{ matrix.app_version }}
      versions-override: ${{ matrix.versions_override }}
      file: ${{ matrix.dockerfile }}
      jf-build-name: ${{ matrix.build_name }}
      gh-context-artifacts-json: |
        [{"name": "${{ needs.jars-sign.result == 'success' && needs.jars-sign.outputs.gh-artifact-name || needs.jars-fetch.outputs.artifact-name }}", "dest": "artifacts"}]
      build-args-json: ${{ matrix.build_args }}
    secrets:
      build-secrets-json: '{"gpg_public_key": ${{ toJSON(secrets.GPG_PUBLIC_KEY) }}}'
  jars-build:
    name: Build AGS JARs
    needs: version
    if: contains(fromJSON('["release", "dev"]'), needs.version.outputs.mode)
    uses: aerospike/shared-workflows/.github/workflows/reusable_execute-build.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-build-name: aerospike-graph-service-jars
      # Deploy discovers metadata children by AQL prefix, so this must start with the prefix
      # jars-deploy passes as jf-metadata-build-id.
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-jars
      gh-artifact-name: jars-unsigned
      gh-artifact-directory: dist
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      setup-java: true
      java-version: "17"
      publish-build-info: true
      build-script: ./scripts/build-ags-artifacts.sh ${{ needs.version.outputs.version }}

  jars-sign:
    name: Sign AGS JARs
    needs: jars-build
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      gh-unsigned-artifacts: ${{ needs.jars-build.outputs.gh-artifact-name }}
      gh-artifact-name: jars-signed
    # sign-artifacts declares these as required and `secrets: inherit` matches by name; our secrets
    # are UPPER_SNAKE and a secret name cannot contain a hyphen, so inherit leaves them empty.
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  jars-deploy:
    name: Publish AGS JARs
    needs: [version, jars-sign]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-build-name: aerospike-graph-service-jars
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      version: ${{ needs.version.outputs.version }}
      jar-group-id: com.aerospike
      gh-artifact-name: ${{ needs.jars-sign.outputs.gh-artifact-name }}
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  # A container rebuild has no same-run JAR build to consume.
  jars-fetch:
    name: Fetch Published AGS JARs
    needs: version
    if: contains(needs.version.outputs.mode, 'container')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-name: jars-fetched
    steps:
      - name: Harden the Runner (Audit All Outbound Calls)
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: connect
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Fetch the Published JARs
        run: ./scripts/fetch-published-jars.sh "${{ needs.version.outputs.version }}" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jars-fetched
          path: dist
          if-no-files-found: error
          retention-days: 5

  chart-build:
    name: Build the AGS Helm Chart
    needs: version
    if: contains(fromJSON('["release", "dev"]'), needs.version.outputs.mode) || contains(needs.version.outputs.mode, 'chart')
    uses: aerospike/shared-workflows/.github/workflows/reusable_execute-build.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-build-name: aerospike-graph-service-chart
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo-chart
      gh-artifact-name: chart-unsigned
      gh-artifact-directory: dist
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike
      setup-helm: true
      setup-java: false
      publish-build-info: true
      build-script: ./scripts/build-ags-chart.sh ${{ needs.version.outputs.version }} ${{ needs.version.outputs.chart-version }}

  chart-sign:
    name: Sign the AGS Helm Chart
    needs: chart-build
    uses: aerospike/shared-workflows/.github/workflows/reusable_sign-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      gh-unsigned-artifacts: ${{ needs.chart-build.outputs.gh-artifact-name }}
      gh-artifact-name: chart-signed
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  chart-deploy:
    name: Publish the AGS Helm Chart
    needs: [version, chart-sign]
    uses: aerospike/shared-workflows/.github/workflows/reusable_deploy-artifacts.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-build-name: aerospike-graph-service-chart
      jf-build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      jf-metadata-build-id: ${{ github.run_id }}-${{ github.run_attempt }}-buildinfo
      version: ${{ needs.version.outputs.chart-version }}
      gh-artifact-name: ${{ needs.chart-sign.outputs.gh-artifact-name }}
      oidc-provider-name: gh-aerospike
      oidc-audience: aerospike

  # after the JVM dies.
  #
  # No ci-guard: this workflow triggers only on tag push and workflow_dispatch, so a fork cannot
  # reach it.
  smoke-test:
    name: AGS Image Smoke Test and Snyk Container Scan (${{ matrix.variant }}, ${{ matrix.platform }})
    needs: [version, container]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            tag: ${{ needs.version.outputs.version }}
            platform: linux/amd64
            runner: ubuntu-24.04
            expect_arch: X64
          - variant: slim
            tag: ${{ needs.version.outputs.version }}-slim
            platform: linux/amd64
            runner: ubuntu-24.04
            expect_arch: X64
          # Native on both sides: ubuntu-24.04-arm runners, and the Aerospike fixture image
          # publishes a linux/arm64 manifest.
          - variant: full
            tag: ${{ needs.version.outputs.version }}
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            expect_arch: ARM64
          - variant: slim
            tag: ${{ needs.version.outputs.version }}-slim
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            expect_arch: ARM64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # An amd64 host running `--platform linux/arm64` falls back to QEMU once binfmt is
      # registered, which would pass while testing something other than what ships.
      - name: Assert Native Runner Architecture
        env:
          EXPECT_ARCH: ${{ matrix.expect_arch }}
          RUNNER_ARCH_ACTUAL: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH_ACTUAL" != "$EXPECT_ARCH" ]; then
            echo "::error::${{ matrix.platform }} leg is on $RUNNER_ARCH_ACTUAL, expected $EXPECT_ARCH"
            exit 1
          fi
          echo "runner arch $RUNNER_ARCH_ACTUAL, native for ${{ matrix.platform }}"

      - name: Install JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@3054b554c0fb4915b3d58847fb7730c593dbb934 # v5.0.0
        env:
          JF_URL: https://artifact.aerospike.io
          JF_PROJECT: connect
        with:
          version: 2.78.8
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Docker Login to Artifactory
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Pull the Published Image
        id: pull
        env:
          IMAGE: artifact.aerospike.io/connect-docker-dev-local/aerospike-graph-service:${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set Up Snyk CLI for Container Scan
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) binary=snyk-linux ;;
            ARM64) binary=snyk-linux-arm64 ;;
            *)
              echo "::error::Unsupported architecture: $RUNNER_ARCH"
              exit 1
              ;;
          esac
          curl --fail --location --retry 3 --compressed \
            "https://downloads.snyk.io/cli/stable/${binary}" \
            --output "${RUNNER_TEMP}/snyk"
          chmod +x "${RUNNER_TEMP}/snyk"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/snyk" version

      - name: Snyk Container Scan (${{ matrix.variant }} Image)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE: ${{ steps.pull.outputs.image }}
        run: |
          snyk container test "$IMAGE" \
            --severity-threshold=high

      - name: Start Aerospike
        id: aerospike
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
          NETWORK: ags-smoke-net
          SERVER: aerospike-1
          TOOLS: aerospike/aerospike-tools:12.1.1_2
        run: |
          set -euo pipefail
          # The secret holds base64. Written raw, the server reports
          # "missing value for key <the encoded blob>" and exits.
          printf '%s' "$AEROSPIKE_FEATURES_B64" | base64 -d > "${RUNNER_TEMP}/features.conf"
          grep -q '^feature-key-version' "${RUNNER_TEMP}/features.conf"
          docker network create "$NETWORK"

          # The server's config asks for 15000 descriptors and it exits at startup if the
          # container cannot supply them.
          docker run -d --name "$SERVER" --network "$NETWORK" \
            --ulimit nofile=15000 \
            -v "${RUNNER_TEMP}/features.conf:/etc/aerospike/features.conf:ro" \
            aerospike/aerospike-server-enterprise:8.1

          # cluster-stable is the first signal that the node accepts client work. The port
          # binds and the namespace list populates well before that, so neither is a gate.
          ready=""
          for _ in $(seq 1 40); do
            out="$(docker run --rm --network "$NETWORK" "$TOOLS" \
                    asinfo -h "$SERVER" -p 3000 -v cluster-stable 2>/dev/null || true)"
            case "$out" in
              "" | *ERROR*) ;;
              *) ready=1; break ;;
            esac
            sleep 3
          done
          if [ -z "$ready" ]; then
            echo "::error::Aerospike never reported cluster-stable"
            docker logs "$SERVER" 2>&1 | tail -40
            exit 1
          fi

          echo "network=$NETWORK" >> "$GITHUB_OUTPUT"
          echo "container=$SERVER" >> "$GITHUB_OUTPUT"

      - name: Verify Gremlin Write and Read Round-Trip
        env:
          IMAGE: ${{ steps.pull.outputs.image }}
        run: |
          set -euo pipefail
          # Do not unpin: a newer client compiles iterate() into a discard() step this server lacks.
          tinkerpop="$(grep -m1 -oP '(?<=<tinkerpop.version>)[^<]+' pom.xml)"
          pip3 install "gremlinpython==${tinkerpop}"

          # Graph Service exits for good if Aerospike is not ready when it starts, so a client
          # retry loop alone would poll a dead container. Restart the image instead.
          for attempt in 1 2 3; do
            docker rm -f ags-smoke >/dev/null 2>&1 || true
            docker run -d --name ags-smoke -p 8182:8182 \
              --platform "${{ matrix.platform }}" \
              --network "${{ steps.aerospike.outputs.network }}" \
              -e aerospike.client.host="${{ steps.aerospike.outputs.container }}" \
              "$IMAGE"
            if python3 scripts/smoke_gremlin_roundtrip.py ws://localhost:8182/gremlin 120; then
              exit 0
            fi
            echo "::warning::Graph Service did not serve on attempt ${attempt}"
            docker logs ags-smoke 2>&1 | tail -20
          done
          echo "::error::Graph Service never served after 3 starts"
          exit 1

      - name: Collect AGS Container Logs on Failure
        if: failure()
        run: docker logs ags-smoke || true

  # Tag runs only. A manual dispatch publishes artifacts but deliberately creates no bundle:
  # bundles are the promotion vehicle, and a promoted one locks its underlying dev-local
  # artifacts, which would then block re-deploying the same paths.
  #
  # smoke-test is in `needs` so a failed image cannot be bundled. A bundle around a broken image
  jars-bundle:
    name: Create JAR Release Bundle
    needs: [version, jars-deploy]
    if: needs.version.outputs.is-release == 'true'
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-bundle-name: aerospike-graph-service-jars
      version: ${{ needs.version.outputs.version }}
      jf-build-names: "aerospike-graph-service-jars:${{ github.run_id }}-${{ github.run_attempt }}"

  # Deliberately does not wait on jars-bundle: the two are independent release lines.
  container-bundle:
    name: Create Container Release Bundle
    needs: [version, container, smoke-test]
    if: needs.version.outputs.is-release == 'true'
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-bundle-name: aerospike-graph-service-container
      version: ${{ needs.version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The docker workflow numbers build-info by run_number, not run_id-run_attempt.
      jf-build-names: "aerospike-graph-service:${{ github.run_number }},aerospike-graph-service-slim:${{ github.run_number }}"

  chart-bundle:
    name: Create Chart Release Bundle
    needs: [version, chart-deploy]
    if: needs.version.outputs.is-release == 'true'
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
    with:
      gh-workflows-ref: 0d843cff870d70ac527048ab0d006c7c301fbb2f # v4.1.0
      jf-project: connect
      jf-bundle-name: aerospike-graph-service-chart
      # The chart moves on its own version line, so the bundle is versioned by chart-version.
      version: ${{ needs.version.outputs.chart-version }}
      jf-build-names: "aerospike-graph-service-chart:${{ github.run_id }}-${{ github.run_attempt }}"
