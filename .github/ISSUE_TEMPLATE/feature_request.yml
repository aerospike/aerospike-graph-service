name: Feature request
description: Propose a new feature or enhancement.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement. Before filing, please
        check that there isn't already an issue or discussion on the
        same topic.

        For larger proposals (anything touching on-disk format, public
        API, or cross-module behavior), consider opening a Discussion
        first — it's a lower-friction place to shape the idea.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem you're trying to solve?
      description: Describe the user-facing problem or limitation. Avoid jumping straight to a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have a concrete idea, describe it. API sketches, traversal examples, and config snippets are all welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Workloads, scale, deployment topology — whatever helps frame the request.
