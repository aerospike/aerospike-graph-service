name: Publish Firefly Container

# Publish the container if a tag of 'v*' is made.
# Example: v0.0.1, v0.1.0, v1.0.0, etc.
on:
  # TODO: Remove pull_request: branches: [main]. This is for testing only.
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

env:
  REPOSITORY_NAME: aerospike
  IMAGE_NAME: firefly
  REGISTRY_URL: ghcr.io

jobs:
  build:
    name: Publish Firefly Docker Image
    permissions:
      packages: write
      contents: read
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        run: |
          # Login to ghcr.io.
          echo ${{ secrets.CONTAINER_PUBLISH_PASSWORD }} | docker login $REGISTRY_URL --username ${{ secrets.CONTAINER_PUBLISH_USERNAME }} --password-stdin

      - name: Publish Container
        run: |          
          # Strip git ref prefix from version
          # VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          
          # Strip "v" prefix from tag name
          # [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')
          
          # Use Docker `latest` tag convention
          # [ "$VERSION" == "main" ] && VERSION=latest
          
          # TODO: Use actual version
          echo "VERSION=$VERSION"
          VERSION=0.0.0-docker-test
          
          # Get registry URL and convert to lower case.
          OUTPUT_IMAGE=$REGISTRY_URL/$REPOSITORY_NAME/$IMAGE_NAME:$VERSION
          OUTPUT_IMAGE=$(echo $OUTPUT_IMAGE | tr '[A-Z]' '[a-z]')
          
          # Build and tag docker image.
          echo "Building and tagging docker image"
          docker build --tag ghcr.io/$REPOSITORY_NAME/$IMAGE_NAME:$VERSION .
          
          # Push Docker tag.
          echo "Pushing docker tag"
          docker push ghcr.io/$REPOSITORY_NAME/$IMAGE_NAME:$VERSION
