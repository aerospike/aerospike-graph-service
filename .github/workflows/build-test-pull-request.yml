          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Run Firefly nsup Tests
        env:
          AEROSPIKE_FEATURES_B64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
        run: |
          bash -x scripts/start_aerospike_nsup.sh
          mvn test -pl aerospike-graph-gremlin -Dtest=FireflyMergeEdgeStepNSupDisabledTest --no-transfer-progress
  test-mrt:
