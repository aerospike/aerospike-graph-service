name: Build OLAP and Test
permissions:
  id-token: write
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch to build OLAP artifact'
        required: true
        default: '3.x-dev'
      aerospike_count:
        description: 'Number of Aerospike instances'
        required: true
        default: '3'
      aerospike_instance:
        description: 'Aerospike instance type'
        required: true
        default: 'n2d-highmem-16'
      aerospike_version:
        description: 'Aerospike version'
        required: true
        default: '7.0.*'
      aerospike_ssd_count:
        description: 'Number of SSDs for Aerospike instances'
        required: true
        default: '2'
      spark_node_count:
        description: 'Number of Spark nodes'
        required: true
        default: '3'
      spark_instance_type:
        description: 'Spark instance type'
        required: true
        default: 'n2d-highmem-16'
      spark_disk_size:
        description: 'Disk size for Spark nodes'
        required: true
        default: '150'
      bulk_load_vertex_files:
        description: 'Bulk load vertex files'
        required: true
        default: 'gs://scale-free-graphs/PropertyCorrected/SF1200M/edges'
      bulk_load_edge_files:
        description: 'Bulk load edge files'
        required: true
        default: 'gs://scale-free-graphs/PropertyCorrected/SF1200M/edges'
      scratch_directory:
        description: 'Scratch directory for Spark (alphanumeric appended at runtime)'
        required: true
        default: 'gs://olap-testing-scratch/'
      spark_executor_memory_overhead:
        description: "Sets value spark.executor.memoryOverhead in spark submit."
        required: true
        default: '1024m'
      spark_executor_memory:
        description: "Sets value spark.executor.memory in spark submit."
        required: true
        default: '4g'
      spark_executor_cores:
        description: 'Sets value spark.executor.cores in spark submit.'
        required: true
        default: '1'
      spark_task_cpus:
        description: 'Sets value spark.task.cpus in spark submit.'
        required: true
        default: '1'
      olap_executor_cores:
        description: 'Number of OLAP executor to use cores - leaving empty will multiply vpus per worker by worker count'
        required: true
        default: ''
      olap_query:
        description: 'OLAP query to run (multiple queries can be specified with "|")'
        required: true
        default: 'g.with("evaluationTimeout", 6000).withComputer().V().hasLabel("person").count()|g.with("evaluationTimeout", 6000).withComputer().V().hasLabel("person").out("knows").count()'
      olap_query_execution_count:
        description: 'Number of times to execute the OLAP query'
        required: true
        default: '1'
      olap_query_warmup_count:
        description: 'Number of warm-up executions for the OLAP query'
        required: true
        default: '0'
      bulk_load_properties:
        description: 'Bulk load property key-value pairs with "|" separator.'
        required: true
        default: 'aerospike.graph.index.vertex.label.enabled'
      cleanup_clusters:
        description: 'Cleanup clusters after the run - true/false - If true the Aerospike and Spark clusters will be destroyed after the run, otherwise they will be left running for debugging purposes.'
        required: true
        default: 'true'
      client_instance_type:
        description: 'Client instance type for benchmark machine'
        required: true
        default: 'n2d-standard-4'
env:
  features_b64: ${{ secrets.AEROSPIKE_DEV_LICENSE }}
  features_file: ${{ github.workspace }}/.github/aerospike/features.conf
  custom_conf: ${{ github.workspace }}/.github/aerospike/aerospike-rf1.conf
  client_count: 1
  region: us-central1
  zone: us-central1-a
  project: firefly-aerospike

jobs:
  trigger-weekly-benchmark:
    name: Weekly Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Authorize gcloud CLI
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCS_KEYFILE_B64 }}

      - name: Download, Install, and Configure Aerolab
        run: |
          cd /tmp && wget https://github.com/aerospike/aerolab/releases/download/7.3.0/aerolab-linux-amd64-7.3.0.zip
          unzip aerolab-linux-amd64-7.3.0.zip -d /usr/local/bin/
          aerolab config backend -t gcp -o firefly-aerospike

      - name: Set Up gcloud CLI
        uses: google-github-actions/setup-gcloud@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5

      - name: Login to GitHub Container Registry
        run: |
          echo ${{ secrets.CONTAINER_PUBLISH_PASSWORD }} | docker login ghcr.io --username ${{ secrets.CONTAINER_PUBLISH_USERNAME }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Latch Date and Time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: date_format
        with:
          format: "yyyy-MM-dd"

      - name: Clamp Runtime Variables to Environment
        run: |
          description_val=${{ steps.date_format.outputs.year }}${{ steps.date_format.outputs.month }}${{ steps.date_format.outputs.day }}${{ steps.date_format.outputs.seconds }}
          bulk_jar_uri_val=${{ github.event.inputs.scratch_directory }}/${description_val}/aerospike-graph-bulk-loader.jar
          olap_jar_uri_val=${{ github.event.inputs.scratch_directory }}/${description_val}/aerospike-graph-analytics.jar
          properties_file_uri_val=gs://gha-ci-firefly-bulkloader/weekly-benchmark/${description_val}-perf/ags-properties.conf
          aerospike_name_val=aga-${description_val}-as
          dataproc_name_val=aga-${description_val}-dproc
          benchmark_client_name_val=aga-${description_val}-lg
          
          # Extract number of cores from instance type
          num_cores_per_instance=$(echo "${{ github.event.inputs.spark_instance_type }}" | grep -o '[0-9]\+$')
          if [ -z "${{ github.event.inputs.olap_executor_cores }}" ]; then
              spark_executor_cores_val=$((${{ github.event.inputs.spark_node_count }} * ${num_cores_per_instance}))
          else
              spark_executor_cores_val=${{ github.event.inputs.olap_executor_cores }}
          fi
          
          echo "description=${description_val}" >> $GITHUB_ENV
          echo "bulk_jar_uri=${bulk_jar_uri_val}" >> $GITHUB_ENV
          echo "olap_jar_uri=${olap_jar_uri_val}" >> $GITHUB_ENV
          echo "properties_file_uri=${properties_file_uri_val}" >> $GITHUB_ENV
          echo "aerospike_name=${aerospike_name_val}" >> $GITHUB_ENV
          echo "dataproc_name=${dataproc_name_val}" >> $GITHUB_ENV
          echo "benchmark_client_name=${benchmark_client_name_val}" >> $GITHUB_ENV
          echo "spark_executor_cores=${spark_executor_cores_val}" >> $GITHUB_ENV

      - name: Build and publish Bulk Loader and OLAP artifacts
        run: |
          # Build bulk loader & OLAP artifacts.
          mvn clean install -DskipTests --no-transfer-progress
          
          # Copy the OLAP artifact to GCS.
          gcloud storage cp \
              ${{ github.workspace }}/aerospike-graph-analytics/target/aerospike-graph-analytics-*.jar \
              ${{ env.olap_jar_uri }}
          
          # Copy the bulk loader artifact to GCS.
          gcloud storage cp \
              ${{ github.workspace }}/aerospike-graph-bulk-loader/target/aerospike-graph-bulk-loader-*.jar \
              ${{ env.bulk_jar_uri }}

          # TODO: Generate and upload properties file.
          echo "aerospike.graphloader.vertices=${{ github.event.inputs.bulk_load_vertex_files }}" > ${{ github.workspace }}/benchmark-bulk-load-config.properties
          echo "aerospike.graphloader.edges=${{ github.event.inputs.bulk_load_edge_files }}" >> ${{ github.workspace }}/benchmark-bulk-load-config.properties
          echo "aerospike.graphloader.temp-directory=${{ github.event.inputs.scratch_directory }}/temp" >> ${{ github.workspace }}/benchmark-bulk-load-config.properties
          echo "aerospike.client.host=aerolab4-${{ env.aerospike_name }}-1" >> ${{ github.workspace }}/benchmark-bulk-load-config.properties
          # Loop through bulk_load_properties and split by '|'
          IFS='|' read -ra properties <<< "${{ github.event.inputs.bulk_load_properties }}"
          for property in "${properties[@]}"; do
              echo "$property" >> ${{ github.workspace }}/benchmark-bulk-load-config.properties
          done
          
          # Upload the properties file to GCS.
          gcloud storage cp \
                ${{ github.workspace }}/benchmark-bulk-load-config.properties \
                ${{ env.properties_file_uri }}

      - name: Deploy to GCP and Bulk Load
        run: |
          # Create Aerospike cluster.
          echo ${{ env.features_b64 }} | base64 -d > ${{ env.features_file }}
      
          aerolab cluster create \
            --zone ${{ env.zone }} \
            --name "${{ env.aerospike_name }}" \
            --count "${{ github.event.inputs.aerospike_count }}" \
            --instance "${{ github.event.inputs.aerospike_instance }}" \
            --aerospike-version "${{ github.event.inputs.aerospike_version }}" \
            --featurefile "${{ env.features_file }}" \
            --customconf "${{ env.custom_conf }}" \
            --disk pd-ssd:20 \
            --disk local-ssd@"${{ github.event.inputs.aerospike_ssd_count }}" \
            --start n
          
          # Partition cluster disks.
          aerolab cluster partition create \
            --name "${{ env.aerospike_name }}" \
            --filter-type nvme \
            --partitions 24,24,24,24
          
          aerolab cluster partition conf \
            --name "${{ env.aerospike_name }}" \
            --namespace test \
            --filter-type nvme \
            --filter-partitions 1,2,3,4 \
            --configure device
          
          # Start cluster.
          aerolab aerospike start --name="${{ env.aerospike_name }}"
          
          aerolab cluster list -j | jq '.' > ${{ github.workspace }}/clusters.json
          python3 ${{ github.workspace }}/scripts/generate_bulk_load_config.py ${{ env.aerospike_name }} ${{ github.workspace }}/benchmark-bulk-load-config.properties
          gcloud storage cp \
            ${{ github.workspace }}/benchmark-bulk-load-config.properties \
            ${{ env.properties_file_uri }}

          # Execute the dataproc command
          gcloud dataproc clusters create "${{ env.dataproc_name }}" \
            --enable-component-gateway \
            --region ${{ env.region }} \
            --zone ${{ env.zone }} \
            --master-machine-type "${{ github.event.inputs.spark_instance_type }}" \
            --master-boot-disk-type pd-ssd \
            --master-boot-disk-size ${{ github.event.inputs.spark_disk_size }} \
            --num-workers "${{ github.event.inputs.spark_node_count }}" \
            --worker-machine-type "${{ github.event.inputs.spark_instance_type }}" \
            --worker-boot-disk-type pd-ssd \
            --worker-boot-disk-size ${{ github.event.inputs.spark_disk_size }} \
            --image-version 2.1-debian11 \
            --properties spark:spark.history.fs.gs.outputstream.type=FLUSHABLE_COMPOSITE \
            --project ${{ env.project }}

          gcloud dataproc jobs submit spark \
            --class=com.aerospike.firefly.bulkloader.SparkBulkLoader \
            --jars="${{ env.bulk_jar_uri }}" \
            --cluster="${{ env.dataproc_name }}" \
            --region="${{ env.region }}" \
            -- -c "${{ env.properties_file_uri }}"

      - name: Launch Aerospike Graph Analytics
        run: |
          gcloud dataproc jobs submit spark \
              --class=com.aerospike.firefly.olap.DistributedGraphComputerMain \
              --jars="${{ env.olap_jar_uri }}" \
              --cluster="${{ env.dataproc_name }}" \
              --region="${{ env.region }}" \
              --async \
              --properties=\
              spark.executor.memoryOverhead=${{ github.event.inputs.spark_executor_memory_overhead }},\
              spark.executor.memory=${{ github.event.inputs.spark_executor_memory }},\
              spark.executor.cores=${{ github.event.inputs.spark_executor_cores }},\
              spark.task.cpus=${{ github.event.inputs.spark_task_cpus }},\
              spark.speculation=false,\
              spark.executor.instances=${{ env.spark_executor_cores }},\
              spark.dynamicAllocation.enabled=true,\
              spark.dynamicAllocation.minExecutors=${{ env.spark_executor_cores }},\
              spark.dynamicAllocation.maxExecutors=${{ env.spark_executor_cores }},\
              spark.dynamicAllocation.initialExecutors=${{ env.spark_executor_cores }},\
              spark.scheduler.minRegisteredResourcesRatio=1.0,\
              -- -c "${{ env.properties_file_uri }}"
          
          master_ip_address_val=$(gcloud compute instances list \
              --filter="name~'^${{ env.dataproc_name }}-m'" \
              --format="value(networkInterfaces[0].networkIP)")
          echo "master_ip_address=${master_ip_address_val}" >> $GITHUB_ENV

      - name: Run Benchmark
        run: |
          # Create client machine.
          aerolab client create none --zone=${{ env.zone }} --disk=pd-ssd:40 --instance ${{ github.event.inputs.client_instance_type }} -n ${{ env.benchmark_client_name }}
          aerolab client list -j | jq '.' > ${{ github.workspace }}/clients.json
          gcloud compute scp --zone=${{ env.zone }} ${{ github.workspace }}/scripts/run-benchmark-gcp-olap-benchmark.sh aerolab4-${{ env.benchmark_client_name }}-1:run-benchmark-gcp-olap-benchmark.sh
          gcloud compute ssh --zone=${{ env.zone }} aerolab4-${{ env.benchmark_client_name }}-1 --command "sudo bash run-benchmark-gcp-olap-benchmark.sh ${{ env.master_ip_address }} ${{ github.event.inputs.olap_query }} ${{ github.event.inputs.olap_query_execution_count }} ${{ github.event.inputs.olap_query_warmup_count }}"

      - name: Retrieve Tinkerbench Results
        run: |
          tinkerbench_result_dir=$(gcloud compute ssh --zone=${{ env.zone }} aerolab4-${{ env.benchmark_client_name }}-1 --command "pwd")
          gcloud compute scp --zone=${{ env.zone }} aerolab4-${{ env.benchmark_client_name }}-1:${tinkerbench_result_dir}/tinkerbench/benchmark-result-* tinkerbench_output.json

      - name: Publish Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Publish Benchmark Results
          tool: 'customSmallerIsBetter'
          output-file-path: tinkerbench_output.json
          auto-push: true
          alert-threshold: '105%'
          comment-on-alert: true
          fail-on-alert: false
          max-items-in-chart: 750
          github-token: ${{ secrets.PUBLISH_BENCHMARKS_TOKEN }}
          benchmark-data-dir-path: docs/

      - name: Stop Benchmark machine
        if: ${{ always() && github.event.inputs.cleanup_clusters == 'true' }}
        run: |
          yes | aerolab client destroy -n "${{ env.benchmark_client_name }}"

      - name: Stop dataproc cluster
        if: ${{ always() && github.event.inputs.cleanup_clusters == 'true' }}
        run: |
          gcloud dataproc jobs delete -q --region ${{ env.region }} "$(gcloud dataproc jobs list --cluster="${{ env.dataproc_name }}" --region="${{ env.region }}" --format="value(JOB_ID)")"
          gcloud dataproc clusters delete -q --region=${{ env.region }} ${{ env.dataproc_name }}

      - name: Stop Aerospike cluster
        if: ${{ always() && github.event.inputs.cleanup_clusters == 'true' }}
        run: |
          yes | aerolab cluster destroy -n "${{ env.aerospike_name }}"