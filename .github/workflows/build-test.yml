name: Build and Test Firefly

on:
  push:
    branches: [main,3.x-dev]
  pull_request:
    branches: [main,3.x-dev]

jobs:
  build-firefly-maven:
    name: Build Firefly Maven
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.9.5
      - name: Build Maven Project
        run: |
          mvn install -DskipTests --no-transfer-progress
          mvn test -pl aerospike-graph-olap -Dtest=TestDistributedGraphComputerMainSSL --no-transfer-progress
