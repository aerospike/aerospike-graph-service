aerospike.client.host = localhost
aerospike.client.port = 3000
aerospike.client.namespace = test
aerospike.graph.data.model = packed
aerospike.graphloader.edges = src/test/resources/recoverydata/edges
aerospike.graphloader.vertices = src/test/resources/recoverydata/vertices
aerospike.graphloader.temp-directory = src/test/resources/recoverydata/testing-recovery
aerospike.graphloader.keep-provided-edge-id-as-property = false
aerospike.graphloader.provided-edge-id-property-name = ~providedId
aerospike.graphloader.sampling-percentage = 0.1
aerospike.graphloader.spark-log-level=INFO
