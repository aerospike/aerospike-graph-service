          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          label: ${{ needs.start-runner-docker.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner-docker.outputs.ec2-instance-id }}
  stop-runner-spark-bulk-loader:
    name: Stop Spark Bulk Loader Runner
    needs:
      - test-firefly-spark-bulk-loader
      - start-runner-spark-bulk-loader
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
