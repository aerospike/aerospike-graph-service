name: Snyk Vulnerability Check

on:
  pull_request:
    branches: [main,3.x-snyk]

jobs:
  ci-guard:
    # Fork-safe / label-gated gate. Downstream jobs depend on this via
    # `needs: ci-guard`, so on fork PRs that lack the `trusted-ci`
    # label this job fails fast and the rest of the workflow is
    # skipped, keeping AWS/GCS/license secrets out of reach.
    name: CI guard (fork + label check)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Gate
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "Non-PR event ($EVENT) — ci-guard allows."
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$BASE_REPO" ]]; then
            echo "Same-repo PR ($HEAD_REPO) — ci-guard allows."
            exit 0
          fi
          if grep -q '"trusted-ci"' <<<"$LABELS"; then
            echo "Fork PR carries 'trusted-ci' label — ci-guard allows."
            exit 0
          fi
          echo "::error::Fork PRs must carry the 'trusted-ci' label before"
          echo "::error::CI with secrets will run. A maintainer will add the"
          echo "::error::label after reviewing the diff. See CONTRIBUTING.md."
          exit 1

  snyk-test:
    needs: ci-guard
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Set up JDK 17
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3.14.1
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Maven
        uses: step-security/setup-maven@8b5f727904660c4b112d02624218c791126af325 # v5.0.0
        with:
          maven-version: 3.9.5
      - name: Snyk Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mvn clean install -DskipTests
          mvn snyk:test@snyk-test
