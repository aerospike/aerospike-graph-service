# Publishes the aerospike-graph Helm chart alone, using the version in
# helm/aerospike-graph/Chart.yaml, into its own release bundle.
#
# Normal dev and release runs use publish-ags-artifacts.yml, which includes
# the chart. This workflow is rarely needed; use it when the chart changes
# independently of an AGS version release.
#
# Bump Chart.yaml before dispatching. An overwrite of an already published chart path succeeds
# silently, and the published copy then drifts from the bundle that referenced it.
name: Publish AGS Helm Chart

on:
  workflow_dispatch:

# publish-ags-artifacts.yml cannot request more than this grants.
permissions:
  id-token: write
  contents: read
  packages: write
  attestations: write

jobs:
  publish:
    name: Publish the Chart
    uses: ./.github/workflows/publish-ags-artifacts.yml
    with:
      scope: chart
    # Its own calls to sign-artifacts pass the GPG secrets explicitly because those input names
    # are hyphenated; the repository secret names are UPPER_SNAKE, which inherit does match.
    secrets: inherit
