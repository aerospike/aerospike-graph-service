[pytest]
testpaths = tests
# Native replacement for the old `python_paths = .` (required the unmaintained
# pytest-pythonpath plugin and was silently ignored as an unknown config option).
pythonpath = .
# Silence the known-benign gremlinpython/aiohttp teardown race (see
# load_balancer.py's close()) instead of letting it show up as a CI error.
filterwarnings =
    ignore:.*Exception ignored in.*ClientResponse\.__del__.*:pytest.PytestUnraisableExceptionWarning
    ignore:.*Exception ignored in.*AiohttpTransport\.__del__.*:pytest.PytestUnraisableExceptionWarning
    ignore:coroutine .*async_close.* was never awaited:RuntimeWarning
